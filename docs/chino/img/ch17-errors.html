<!doctype html>
<!--
  Chapter 17, when something goes wrong: the figures of docs/chino/errors.md.
  Each <figure class="shot" id="…"> becomes docs/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Home in the row's figure is chapter 4's (ch04-home.html).
  Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 17 when something goes wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* details: the status, for the people who fix things */
  .det { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); }
  .det-b { margin: -4px 0 0; font: 500 12px/1.4 var(--ff-mono); color: var(--fg-muted); }
  .tv .det-b { margin-top: 6px; font-size: 11px; color: var(--fg-dim); }
  .tv .empty .text { max-width: 440px; }
  .tv .mid { position: absolute; left: 0; right: 48px; top: 0; bottom: 0; }

  /* home on a phone, as chapter 4 draws it, scrolled down to its rows */
  .phone .hero { position: relative; height: 392px; }
  .phone .hero .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .phone .t { font-size: 26px; } .phone .meta { font-size: 12px; }
  .phone .hero .row > .b { flex: 1; padding: 0 12px; }
  .phone .entry { margin: 16px 16px 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
                  border: 1px solid var(--border-2); background: var(--surface); font: 600 14px/1 var(--ff-mono); }
  .phone .entry .chev { margin-left: auto; color: var(--fg-dim); }
  .phone .shelf { padding: 20px 0 0 16px; }
  .shelf .h2 { margin-bottom: 12px; }
  .phone .card { width: 200px; } .phone .card .img { height: 112px; }
  .scrolled { margin-top: -236px; }

  /* a part of a page that couldn't load, in the part's place, at the small size */
  .part { margin-right: 16px; height: 152px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .part .h3 { font: 600 15px/1.3 var(--ff-mono); color: var(--fg); }
  .part .text { font-size: 13px; }
  .part .b { margin-top: 2px; }
</style>
</head>
<body>

<!-- Figure 17.1 · a page that couldn't load, on a computer -->
<figure class="shot" id="errors-page-computer">
  <div class="computer" data-view="none">
    <div class="empty" style="margin-top:208px">
      <i data-i="circle-alert" class="s48"></i>
      <h2 class="h2" data-co="1">couldn't load this title</h2>
      <p class="text" data-co="2">The server ran into a problem.</p>
      <span class="b" style="margin-top:6px" data-co="3"><i data-i="refresh-cw" class="s16"></i>try again</span>
      <span class="det" style="margin-top:8px" data-co="4">details<i data-i="chevron-up" class="s14"></i></span>
      <p class="det-b">HTTP 500 Internal Server Error</p>
    </div>
  </div>
</figure>

<!-- Figure 17.2 · a page that couldn't load, on a phone -->
<figure class="shot" id="errors-page-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="" data-co-parts="back:1">
    <div class="empty" style="margin-top:200px;padding:0 24px">
      <i data-i="hourglass" class="s48"></i>
      <h2 class="h2">couldn't load this title</h2>
      <p class="text">The server is busy.</p>
      <span class="b" style="margin-top:6px"><i data-i="refresh-cw" class="s16"></i>try again</span>
      <span class="det" style="margin-top:8px" data-co="2">details<i data-i="chevron-down" class="s14"></i></span>
    </div>
  </div>
</figure>

<!-- Figure 17.3 · a page that couldn't load, on a TV -->
<figure class="shot" id="errors-page-tv">
  <div class="tv" data-view="none">
    <div class="page">
      <div class="mid">
        <div class="empty" style="margin-top:120px">
          <i data-i="circle-alert" class="s48"></i>
          <h2 class="h2">couldn't load this title</h2>
          <p class="text">The server didn't accept the request. Check for an app update.</p>
          <span class="b focus" style="margin-top:8px" data-co="1"><i data-i="refresh-cw" class="s16"></i>try again</span>
          <p class="det-b" data-co="2">HTTP 400 Bad Request</p>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 17.4 · a part of a page that couldn't load: a row of home, on a phone -->
<figure class="shot" id="errors-row-phone">
  <div class="phone" data-view="home">
    <div class="scrolled">
      <section class="hero">
        <div class="art steel"></div><div class="scrim-b"></div>
        <div class="txt">
          <h1 class="t">Tears of Steel</h1>
          <p class="meta">2012 · 12 min · science fiction</p>
          <div class="row"><span class="b primary"><i data-i="play" class="fill"></i>play</span><span class="b">see details</span><span class="b icon" style="flex:none"><i data-i="clapperboard"></i></span></div>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </section>
      <div class="entry"><i data-i="zap"></i>zap<i data-i="chevron-right" class="chev"></i></div>
      <section class="shelf">
        <h2 class="h2">continue watching</h2>
        <div class="part">
          <h3 class="h3" data-co="1">couldn't load continue watching</h3>
          <p class="text">The server ran into a problem.</p>
          <span class="b" data-co="2"><i data-i="refresh-cw" class="s16"></i>try again</span>
        </div>
      </section>
      <section class="shelf">
        <h2 class="h2" data-co="3">recently added movies</h2>
        <div class="cards">
          <div class="card"><div class="img"><div class="art a6"></div></div><div class="tt">Charge</div></div>
          <div class="card"><div class="img"><div class="art a2"></div></div><div class="tt">Coffee Run</div></div>
        </div>
      </section>
    </div>
  </div>
</figure>

<!-- Figure 17.5 · a title that was removed, on a phone -->
<figure class="shot" id="errors-removed-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="">
    <div class="empty" style="margin-top:220px;padding:0 24px">
      <i data-i="circle-slash" class="s48"></i>
      <h2 class="h2" data-co="1" style="max-width:240px">this title isn't in the library anymore</h2>
      <span class="b" style="margin-top:6px" data-co="2"><i data-i="arrow-left" class="s16"></i>back</span>
    </div>
  </div>
</figure>

<!-- Figure 17.6 · no access, on a TV -->
<figure class="shot" id="errors-no-access-tv">
  <div class="tv" data-view="none">
    <div class="page">
      <div class="mid">
        <div class="empty" style="margin-top:150px">
          <i data-i="lock" class="s48"></i>
          <h2 class="h2" data-co="1">you don't have access to this</h2>
          <span class="b focus" style="margin-top:8px" data-co="2"><i data-i="arrow-left" class="s16"></i>back</span>
        </div>
      </div>
    </div>
  </div>
</figure>

<script src="frame.js"></script>
</body>
</html>
