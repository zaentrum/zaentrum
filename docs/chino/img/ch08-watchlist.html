<!doctype html>
<!--
  Chapter 8, watchlist and lists: the figures of docs/chino/watchlist.md.
  Each <figure class="shot" id="…"> becomes docs/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 8 watchlist and lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* artwork for the films home doesn't draw (as in chapter 5) */
  .x2 { background: linear-gradient(160deg, #557232 0%, #2e3d1a 58%, #151c0c 100%); }
  .x3 { background: linear-gradient(160deg, #723030 0%, #3e1a1a 58%, #1c0c0c 100%); }
  .x5 { background: linear-gradient(160deg, #7a4a5f 0%, #432836 58%, #1f1219 100%); }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  /* a list's row: its name and count, its newest titles, and see all at its end */
  .shelf { margin-bottom: 28px; }
  .shelf .h2 { margin-bottom: 12px; }
  .h2 .n { color: var(--fg-dim); font-weight: 500; }
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  .seeall { flex: none; width: 150px; height: 225px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            background: var(--surface); border: 1px solid var(--border); color: var(--cloud-blue); font: 600 14px/1 var(--ff-mono); }
  /* a list's own view */
  .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid .card.poster { width: auto; } .grid .card.poster .img { height: 233px; }
  .titlerow { display: flex; align-items: center; gap: 16px; }
  .listcount { margin: -14px 0 24px 64px; }
  /* the dialogs, over the dimmed page */
  .dlg.on { position: absolute; left: 50%; top: 230px; transform: translateX(-50%); z-index: 30; width: 440px; }
  .field.err { border-color: var(--signal-red); box-shadow: inset 0 0 0 1px var(--signal-red); color: var(--fg); }
  .errtext { margin: -4px 0 0; font: 400 12px/1.4 var(--ff-ui); color: var(--signal-red); }
  /* a phone: two cards and a part of the next */
  .phone .h1 { font-size: 22px; }
  .phone .head { margin-bottom: 16px; }
  .phone .shelf { margin-bottom: 24px; }
  .phone .shelf .h2 { margin-bottom: 10px; }
  .phone .card.poster { width: 128px; } .phone .card.poster .img { height: 192px; }
  .phone .card .tt { font-size: 13px; }
  /* a TV: the page keeps to the safe area; rows run on to the screen's edge */
  .tv .inner { width: 768px; padding-top: 8px; }
  .tv .head { margin-bottom: 16px; }
  .tv .shelf { margin-bottom: 20px; }
  .tv .shelf .h2 { margin-bottom: 10px; }
  .tv .seeall { width: 120px; height: 180px; font-size: 13px; }
  .tv .card .img.focus + .tt { color: var(--fg); }
  .tv .b.focus { background: var(--surface-focus); }
</style>
</head>

          <div class="seeall" data-co="4" data-co-side="right"><i data-i="chevron-right" class="s32"></i>see all</div>
        </div>
      </section>
      <section class="shelf">
        <h2 class="h2" data-co="5">Sunday nights<span class="n"> · 4</span></h2>
        <div class="cards">
          <div class="card poster"><div class="img"><div class="art steel"></div></div><div class="tt">Tears of Steel</div><div class="st">2012</div></div>

          <div class="card poster"><div class="img"><div class="art a2"></div><div class="bar"><i style="width:36%"></i></div></div><div class="tt">Sintel</div><div class="st">2010</div></div>
          <div class="card poster"><div class="img"><div class="art a4"></div><div class="bar"><i style="width:68%"></i></div></div><div class="tt">Cosmos Laundromat</div><div class="st">2015</div></div>
          <div class="seeall"><i data-i="chevron-right" class="s32"></i>see all</div>
        </div>
      </section>
    </div>
  </div>
</figure>
