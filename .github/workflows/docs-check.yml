name: docs-check

# The docs have lied before — a section described a setup API no service
# implements. Structure we can check, we check: every relative link resolves,
# every anchor exists, and the site builds from this docs/ and spec/.
#
# The site is https://zaentrum.github.io/ (docs at /docs/, the specification at
# /spec/), built by zaentrum/zaentrum.github.io from main's docs/ and spec/. Its
# build fails on any link or #heading that leads nowhere, and then the live site
# stays as it was. The site job here runs that same build, so a break shows on the
# commit that made it.
on:
  push:
    branches: [main]
    paths: ["docs/**", "spec/**", "scripts/**", ".github/workflows/docs-check.yml"]
  pull_request:
    paths: ["docs/**", "spec/**", "scripts/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: link + anchor check
        run: python3 scripts/check-docs.py
      - name: the specification's structure (numbers, captions, legends)
        run: python3 scripts/check-spec.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zaentrum
      - uses: actions/checkout@v4
        with:
          repository: zaentrum/zaentrum.github.io
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: the site, built from this docs/ and spec/
        working-directory: site
        env:
          DOCS_SOURCE: ${{ github.workspace }}/zaentrum
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm ci --no-audit --no-fund
          npm run build
