<!doctype html>
<!--
  Chapter 12, subtitles: the figures of spec/chino/subtitles.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame is frame.js (the player has no top bar,
  no tabs and no rail), the icons are icons.js. Pink numbers mark the parts
  the chapter's text explains. The look's guides are drawn in mockups.html
  (subtitle-look). Figures 12.1 to 12.6 are screenshots of the deployed web
  player, not drawings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 12 subtitles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the player, as chapter 11 draws it */
  .pl { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .pl .pic { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .phone.side .pl .pic { left: 50%; right: auto; top: 0; bottom: 0; height: 100%; transform: translateX(-50%); }
  .tv .pl .pic { inset: 0; transform: none; aspect-ratio: auto; }
  /* a phone held upright with the panel open: the picture moves to the top */
  .pl .pic.at-top { top: 0; transform: none; }

  /* a subtitle: white, a black outline, no box; 5.33 % of the picture's height */
  .sub { position: absolute; left: 10%; right: 10%; text-align: center; color: #fff; z-index: 8; font-family: var(--ff-ui); font-weight: 500; line-height: 1.25;
         text-shadow: -1.5px -1.5px 0 #000, 0 -1.5px 0 #000, 1.5px -1.5px 0 #000, 1.5px 0 0 #000, 1.5px 1.5px 0 #000, 0 1.5px 0 #000, -1.5px 1.5px 0 #000, -1.5px 0 0 #000; }
  .sub i { font-style: italic; }
  .sub > span { display: inline-block; }

  /* the picture dimmed under the panel; the subtitle line stays above it */
  .dim { position: absolute; inset: 0; background: rgba(5,7,12,.62); z-index: 4; }

  /* the audio and subtitles panel: two columns, square, on the solid surface */
  .panel { position: absolute; z-index: 6; display: flex; background: var(--surface); border: 1px solid var(--border-2); }
  .panel .c { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .panel .c + .c { border-left: 1px solid var(--border); }
  .panel .hd { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; font: 500 13px/1 var(--ff-mono); color: var(--fg-muted); }
  .panel .hd .x { margin-left: auto; margin-right: -12px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg-2); }
  .panel .it { height: 48px; flex: none; display: flex; align-items: center; padding: 0 16px 0 14px; font: 400 15px/1.25 var(--ff-ui); color: var(--fg-muted); white-space: nowrap; }
  .panel .it .ck { width: 28px; flex: none; display: inline-flex; align-items: center; color: var(--cloud-blue); }
  .panel .it.on { color: var(--fg); font-weight: 600; }
  /* where a column is longer than the panel, it scrolls within itself */
  .panel .thumb { position: absolute; right: 3px; width: 3px; background: var(--border-control); }

  /* on a phone held upright the panel is the screen under the picture, the lists one under the other */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--border-2); }
  .sheet .hd { height: 44px; display: flex; align-items: center; padding: 0 16px; font: 500 13px/1 var(--ff-mono); color: var(--fg-muted); }
  .sheet .hd .x { margin-left: auto; margin-right: -10px; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg-2); }
  .sheet .hd.next { border-top: 1px solid var(--border); margin-top: 4px; }
  .sheet .it { height: 48px; display: flex; align-items: center; padding: 0 16px 0 14px; font: 400 15px/1.25 var(--ff-ui); color: var(--fg-muted); }
  .sheet .it .ck { width: 28px; flex: none; display: inline-flex; align-items: center; color: var(--cloud-blue); }
  .sheet .it.on { color: var(--fg); font-weight: 600; }
  .sheet .thumb { position: absolute; right: 3px; width: 3px; background: var(--border-control); }

  /* the TV: rows 40 dp, the focused one in the focus style */
  .tv .panel .hd { height: 38px; font-size: 12px; }
  .tv .panel .it { height: 40px; font-size: 15px; margin: 0 6px; padding-left: 8px; }
  .tv .panel .hd { padding-left: 20px; }
  .tv .panel .it.focus-row { color: var(--fg); position: relative; z-index: 2; }
</style>
</head>
<body>

    <div class="pl">

      <div class="panel" style="left:300px;top:128px;width:680px;height:430px">
        <div class="c" data-co="1">
          <div class="hd">audio</div>
          <div class="it on"><span class="ck"><i data-i="check" class="s16"></i></span>English (original)</div>

          <div class="it"><span class="ck"></span>German</div>

          <div class="it"><span class="ck"></span>English (CC)</div>

          <div class="it"><span class="ck"></span>Dutch</div>
          <i class="thumb" style="top:48px;height:150px"></i>
        </div>
      </div>
    </div>
  </div>
</figure>

          <div class="hd">audio<span class="x" data-co="4" data-co-side="right"><i data-i="x"></i></span></div>

        <div class="it"><span class="ck"></span>Croatian</div>

        <div class="it"><span class="ck"></span>Dutch</div>
        <i class="thumb" style="top:6px;height:190px"></i>

  </div>
</figure>
