<!doctype html>
<!--
  Chapter 12, subtitles: the figures of spec/chino/subtitles.md.
  Each figure of class "shot" becomes spec/chino/img/ID.png, ID being its id:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet; ds.js turns the
  <ds-*> tags into the design system's components (the panel's close is its
  icon button, the player's buttons too); frame.js draws the frame (the player
  has no top bar, no tabs and no rail). The audio and subtitles panel stays
  chino's own, drawn here on the design system's tokens; its picked rows have
  the check of the player's menus (ch11-player.html). The look with its guides
  (subtitle-look) is drawn here too and wins over the old mockups.html. Pink
  numbers mark the parts the chapter's text explains, pink dashes are guides.
  Figures 12.1 to 12.6 are screenshots of the deployed web player, not drawings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 12 subtitles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the player, as chapter 11 draws it */
  .pl { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .pl .pic { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .phone.side .pl .pic { left: 50%; right: auto; top: 0; bottom: 0; height: 100%; transform: translateX(-50%); }
  .tv .pl .pic { inset: 0; transform: none; aspect-ratio: auto; }
  /* a phone held upright with the panel open: the picture moves to the top */
  .pl .pic.at-top { top: 0; transform: none; }
  /* its top and bar on a phone held sideways: the design system's icon buttons, 42 dp, 6 dp apart */
  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 12px 12px 36px;
         background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 100%); }
  .top .name { flex: 1; min-width: 0; margin-left: 8px; font: 500 16px/1.2 var(--ff-mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 36px 12px 12px;
            background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 100%); }
  .btns { display: flex; align-items: center; gap: 6px; }
  .btns .sp { flex: 1; }
  .seek { display: flex; align-items: center; gap: 12px; font: 500 13px/1 var(--ff-mono); color: var(--fg-2); }
  .track { position: relative; flex: 1; height: 6px; background: rgba(255,255,255,.15); }
  .track > i { position: absolute; top: 0; bottom: 0; }
  .track .buf { left: 0; background: rgba(255,255,255,.3); }
  .track .played { left: 0; background: var(--cloud-blue); }
  .track .head { top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); background: var(--fg); }

  /* a subtitle: white, a black outline, no box; 5.33 % of the picture's height */
  .sub { position: absolute; left: 10%; right: 10%; text-align: center; color: #fff; z-index: 8; font-family: var(--ff-ui); font-weight: 500; line-height: 1.25;
         text-shadow: -1.5px -1.5px 0 #000, 0 -1.5px 0 #000, 1.5px -1.5px 0 #000, 1.5px 0 0 #000, 1.5px 1.5px 0 #000, 0 1.5px 0 #000, -1.5px 1.5px 0 #000, -1.5px 0 0 #000; }
  .sub i { font-style: italic; }
  .sub > span { display: inline-block; }

  /* the picture dimmed under the panel; the subtitle line stays above it */
  .dim { position: absolute; inset: 0; background: rgba(5,7,12,.62); z-index: 4; }

  /* the audio and subtitles panel: chino's own, two columns, square, on the solid
     surface; its close is the design system's icon button (quiet) */
  .panel { position: absolute; z-index: 6; display: flex; background: var(--surface); border: 1px solid var(--border-2); }
  .panel .c { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .panel .c + .c { border-left: 1px solid var(--border); }
  .panel .hd { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; font: 500 13px/1 var(--ff-mono); color: var(--fg-muted); }
  .panel .hd .nc-iconbtn { margin-left: auto; margin-right: -8px; }
  .panel .it { height: 48px; flex: none; display: flex; align-items: center; padding: 0 16px 0 14px; font: 400 15px/1.25 var(--ff-ui); color: var(--fg-muted); white-space: nowrap; }
  /* the picked row: the check of the player's menus before its name, and the brighter text */
  .panel .it .ck, .sheet .it .ck { width: 28px; flex: none; display: inline-flex; align-items: center; color: var(--cloud-blue); }
  .panel .it.on { color: var(--fg); font-weight: 600; }
  /* where a column is longer than the panel, it scrolls within itself */
  .panel .thumb { position: absolute; right: 3px; width: 3px; background: var(--border-control); }

  /* a phone: the close at 42 dp, in a heading row of 48 dp, its touch area */
  .phone .panel .hd { height: 48px; }
  .phone .panel .hd .nc-iconbtn { margin-right: -12px; }

  /* on a phone held upright the panel is the screen under the picture, the lists one under the other */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--border-2); }
  .sheet .hd { height: 48px; display: flex; align-items: center; padding: 0 16px; font: 500 13px/1 var(--ff-mono); color: var(--fg-muted); }
  .sheet .hd .nc-iconbtn { margin-left: auto; margin-right: -12px; }
  .sheet .hd.next { border-top: 1px solid var(--border); margin-top: 4px; }
  .sheet .it { height: 48px; display: flex; align-items: center; padding: 0 16px 0 14px; font: 400 15px/1.25 var(--ff-ui); color: var(--fg-muted); }
  .sheet .it.on { color: var(--fg); font-weight: 600; }
  .sheet .thumb { position: absolute; right: 3px; width: 3px; background: var(--border-control); }

  /* the TV: rows 40 dp, the focused one in the focus style */
  .tv .panel .hd { height: 38px; font-size: 12px; }
  .tv .panel .it { height: 40px; font-size: 15px; margin: 0 6px; padding-left: 8px; }
  .tv .panel .hd { padding-left: 20px; }
  .tv .panel .it.focus-row { color: var(--fg); position: relative; z-index: 2; }

  /* the look's guides: pink dashes, notes on the drawing */
  .guide.v { top: 0; bottom: 0; width: 0; border-width: 0 0 0 1.5px; }
  .guide.h { left: 0; right: 0; height: 0; border-width: 1.5px 0 0 0; }
</style>
</head>
<body>
