<!doctype html>
<!--
  Chapter 13, downloads and offline: the figures of docs/chino/downloads.md that
  mockups.html doesn't draw (it has the control in each status, the downloads
  screen, the questions and the downloads screen offline).
  Each <figure class="shot" id="…"> becomes docs/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs) is frame.js, the icons are
  icons.js. A title's page follows chapter 6's drawings (ch06-title.html).
  Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 13 downloads and offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the title row's parts, as chapter 6 draws them */
  .split { display: inline-flex; flex: none; height: 48px; border: 1px solid var(--border-2); background: var(--surface); color: var(--fg); }
  .split > span { display: inline-flex; align-items: center; justify-content: center; }
  .split .m { width: 46px; }
  .split .c { width: 40px; border-left: 1px solid var(--border-2); }
  .b.st2 { color: var(--fg-2); }
  .b.wide { width: 100%; }
  /* a label too long for one line wraps as one text, the button growing with it */
  .b.wrap { white-space: normal; height: auto; min-height: 48px; padding: 9px 14px; justify-content: flex-start; text-align: left; line-height: 1.4; }
  .off { opacity: .4; }

  /* a title's page on a phone (chapter 6): the still fading into the page, the poster, the name */
  .bd { position: absolute; left: 0; right: 0; top: 0; height: 200px; overflow: hidden; }
  .bd .fade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,.6) 30%, rgba(11,15,25,0) 60%); }
  .pos { position: relative; flex: none; overflow: hidden; }
  .hd { position: absolute; left: 16px; right: 16px; top: 140px; display: flex; gap: 14px; align-items: flex-start; }
  .hd .pos { width: 96px; height: 144px; }
  .hd .nm { padding-top: 68px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .phone .t { font-size: 22px; }
  .phone .meta { font-size: 12px; }
  .kind { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; margin-left: 4px; border: 1px solid var(--border-2);
          background: var(--surface-2); color: var(--fg-muted); font: 500 11px/1 var(--ff-mono); vertical-align: 1px; }
  .body { position: absolute; left: 16px; right: 16px; top: 300px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .acts .b { padding: 0 14px; }
  .acts .b.icon { padding: 0; }
  .why { margin: -6px 0 0; font: 400 13px/1.45 var(--ff-ui); color: var(--fg-dim); max-width: 320px; }
  .howfar { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--ff-mono); color: var(--fg-2); }

  /* the page from the phone: everything sits under the banner, which doesn't scroll */
  .offline { position: relative; flex: none; height: 100%; }
  .offline > .banner { position: relative; z-index: 3; margin: 12px 16px 0; }
  .offline > .pagebox { position: absolute; left: 0; right: 0; top: 94px; bottom: 0; overflow: hidden; }

  /* a show's episodes: one box per season (chapter 6) */
  .eps > .h2 { margin-bottom: 12px; }
  .season { border: 1px solid var(--border-2); }
  .season .sh { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 12px 0 14px; background: var(--surface); }
  .season .sh .h2 { font-size: 15px; }
  .season .sh .cnt { font: 500 13px/1 var(--ff-mono); color: var(--fg-dim); }
  .season .sh .chev { margin-left: auto; color: var(--fg-muted); }
  .season .offer { padding: 0 12px 12px; background: var(--surface); }
  .ep { border-top: 1px solid var(--border); padding: 12px; }
  .ep .top { display: flex; gap: 12px; }
  .ep .still { position: relative; flex: none; overflow: hidden; width: 128px; height: 72px; }
  .ep .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ep .l1 { display: flex; align-items: baseline; gap: 8px; }
  .ep .code { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-muted); }
  .ep .len { margin-left: auto; flex: none; font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); }
  .ep .nm { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); }
  .ep .ds { margin: 0; font: 400 12px/1.4 var(--ff-ui); color: var(--fg-2); }
  .ep .acts { margin-top: 10px; row-gap: 8px; }

  /* the downloads screen (the figure in mockups.html, inside the frame) */
  .dl { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .dl .line { margin: -4px 0 0; font: 400 13px/1.4 var(--ff-ui); color: var(--fg-dim); }
  .dl .grp { margin-top: 4px; }
  .dl-row { display: flex; gap: 12px; align-items: center; }
  .dl-row .th { position: relative; width: 80px; height: 45px; flex: none; overflow: hidden; }
  .dl-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .dl-row .nm { font: 400 13px/1.35 var(--ff-ui); color: var(--fg); }
  .dl-row .st { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-2); white-space: nowrap; }
  .dl-row .b.icon { width: 40px; height: 40px; }
  .det { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font: 500 12px/1 var(--ff-mono); color: var(--cloud-blue); }
  .titles { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font: 400 13px/1.4 var(--ff-ui); color: var(--fg-2); }
  .dl .empty { margin-top: 96px; }
  /* the bell is hidden while the server can't be reached */
  .nobell > .tb .bell { display: none; }
</style>
</head>
<body>

<!-- Figure 13.3 · a season's downloads, on a phone: nothing of it on the phone yet -->
<figure class="shot" id="downloads-season-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="Pioneer One">
    <section class="eps" style="padding:16px">
      <h2 class="h2">episodes</h2>
      <div class="season">
        <div class="sh"><span class="h2">season 1</span><span class="cnt">6 episodes</span><i data-i="chevron-down" class="chev"></i></div>
        <div class="offer"><span class="b wide wrap" data-co="1"><i data-i="download"></i><span>download season&nbsp;1 · 6&nbsp;episodes · 1.8&nbsp;GB</span></span></div>
        <div class="ep">
          <div class="top">
            <div class="still"><div class="art a1"></div></div>
            <div class="txt">
              <div class="l1"><span class="code">S01E01</span><span class="len">35 min</span></div>
              <span class="nm">Earthfall</span>
              <p class="ds">Something falls from the sky over Montana.</p>
            </div>
          </div>
          <div class="acts">
            <span class="split"><span class="m"><i data-i="bookmark"></i></span><span class="c"><i data-i="chevron-down" class="s16"></i></span></span>
            <span class="b icon"><i data-i="check"></i></span>
            <span class="b" data-co="2"><i data-i="download"></i>download · 281 MB</span>
          </div>
        </div>
        <div class="ep">
          <div class="top">
            <div class="still"><div class="art a3"></div></div>
            <div class="txt">
              <div class="l1"><span class="code">S01E02</span><span class="len">38 min</span></div>
              <span class="nm">The Man From Mars</span>
              <p class="ds">The man found in the wreck says he was born on Mars.</p>
            </div>
          </div>
          <div class="acts">
            <span class="split"><span class="m"><i data-i="bookmark"></i></span><span class="c"><i data-i="chevron-down" class="s16"></i></span></span>
            <span class="b icon"><i data-i="check"></i></span>
            <span class="b"><i data-i="download"></i>download · 347 MB</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</figure>

<!-- Figure 13.6 · downloads the server took off the phone, on a phone -->
<figure class="shot" id="downloads-deleted-phone">
  <div class="phone" data-view="downloads">
    <div class="dl">
      <div class="banner" data-co="1"><i data-i="info" class="s16"></i>
        <div>
          <div>3 downloads were deleted from this phone: they aren't available to this account anymore.</div>
          <span class="det" data-co="2">details<i data-i="chevron-up" class="s14"></i></span>
          <ul class="titles"><li>Cosmos Laundromat</li><li>Charge</li><li>Coffee Run</li></ul>
        </div>
      </div>
      <h1 class="h1">downloads</h1>
      <p class="line">401 MB used by downloads · 18 GB free on this phone</p>
      <h2 class="h2 grp">Pioneer One</h2>
      <p class="h3">season 1</p>
      <div class="dl-row">
        <div class="th"><div class="art a1"></div></div>
        <div class="tx"><span class="nm">S01E01 · Earthfall</span><span class="st">downloaded · 281 MB</span></div>
        <span class="b icon"><i data-i="trash" class="s16"></i></span>
      </div>
      <h2 class="h2 grp">movies</h2>
      <div class="dl-row">
        <div class="th"><div class="art a4"></div></div>
        <div class="tx"><span class="nm">Sprite Fright</span><span class="st">downloaded · 120 MB</span></div>
        <span class="b icon"><i data-i="trash" class="s16"></i></span>
      </div>
      <div style="margin-top:4px"><span class="b danger">delete all</span></div>
    </div>
  </div>
</figure>

<!-- Figure 13.8 · a show's page from the phone, while the server can't be reached -->
<figure class="shot" id="downloads-title-offline-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="Pioneer One">
    <div class="offline">
      <div class="banner" data-co="1"><i data-i="wifi-off" class="s16"></i><span>Can't reach the server. Your downloads still play.</span></div>
      <div class="pagebox">
        <div class="bd"><div class="art a1"></div><div class="fade"></div></div>
        <div class="hd">
          <div class="pos"><div class="art a1"></div></div>
          <div class="nm">
            <h1 class="t">Pioneer One</h1>
            <p class="meta">2010 · 1 season · drama</p>
            <p class="meta"><span class="kind" style="margin-left:0">show</span></p>
          </div>
        </div>
        <div class="body">
          <span class="b primary" data-co="2"><i data-i="play" class="fill"></i>play S01E01</span>
          <span class="howfar" data-co="3"><i data-i="check" class="s16" style="color:var(--signal-green)"></i>1 episode on this phone</span>
          <p class="desc" data-co="4">An object falls from the sky over Montana, and two federal agents are sent to find out what it is.</p>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 13.9 · a movie whose download waits for its check, on a phone -->
<figure class="shot" id="downloads-check-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="Sprite Fright">
    <div class="offline">
      <div class="banner" data-co="1"><i data-i="wifi-off" class="s16"></i><span>Can't reach the server.</span></div>
      <div class="pagebox" style="top:70px">
        <div class="bd"><div class="art a4"></div><div class="fade"></div></div>
        <div class="hd">
          <div class="pos"><div class="art a4"></div></div>
          <div class="nm">
            <h1 class="t">Sprite Fright</h1>
            <p class="meta">2021 · 10 min</p>
            <p class="meta"><span class="kind" style="margin-left:0">movie</span></p>
          </div>
        </div>
        <div class="body">
          <div class="acts">
            <span class="b primary off" data-co="2"><i data-i="play" class="fill"></i>play</span>
            <span class="b st2" data-co="3" data-co-side="right">downloaded · check needed</span>
          </div>
          <p class="why">Downloads are checked with the server every 30 days. This one plays again once the server can be reached.</p>
          <p class="desc">Teenagers on a trip into the woods meet the small folk who live there, and the small folk don't want them.</p>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 13.10 · nothing downloaded yet, on a phone -->
<figure class="shot" id="downloads-empty-phone">
  <div class="phone" data-view="downloads">
    <div class="dl">
      <h1 class="h1">downloads</h1>
      <p class="line" data-co="1">18 GB free on this phone</p>
      <div class="empty">
        <i data-i="download" class="s48"></i>
        <h2 class="h2" data-co="2">nothing downloaded yet</h2>
        <p class="text">Titles you download show up here, ready to watch without a connection.</p>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 13.11 · the server can't be reached and nothing is downloaded, on a phone -->
<figure class="shot" id="downloads-offline-empty-phone">
  <div class="phone nobell" data-view="downloads" data-co-parts="search:2:top">
    <div class="dl">
      <div class="banner" data-co="1"><i data-i="wifi-off" class="s16"></i><span>Can't reach the server.</span></div>
      <h1 class="h1">downloads</h1>
      <p class="line">18 GB free on this phone</p>
      <div class="empty" style="margin-top:72px">
        <i data-i="download" class="s48"></i>
        <h2 class="h2" data-co="3">nothing downloaded yet</h2>
        <p class="text">Titles you download show up here, ready to watch without a connection.</p>
      </div>
    </div>
  </div>
</figure>

<script src="frame.js"></script>
</body>
</html>
