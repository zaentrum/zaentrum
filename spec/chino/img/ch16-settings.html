<!doctype html>
<!--
  Chapter 16, settings and account: the figures of spec/chino/settings.md (the
  target; the as-deployed figures are screenshots, *-asis-web-*.png).
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 16 settings and account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* settings on a computer: one column of groups, each a heading and a card */
  .set { padding: 32px 48px; width: 816px; display: flex; flex-direction: column; gap: 26px; }
  .set2 { padding: 28px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; align-items: start; }
  .set2 > .h1 { grid-column: 1 / -1; margin-bottom: 22px; }
  .set2 .colg { display: flex; flex-direction: column; gap: 24px; }
  .srow.stack { flex-direction: column; align-items: stretch; gap: 8px; }
  .srow.stack .field { width: auto; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .srow { display: flex; align-items: flex-start; gap: 24px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .srow:first-child { border-top: none; }
  .srow.mid { align-items: center; }
  .lab { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .lab .ttl { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); }
  .lab .hint { font: 400 13px/1.5 var(--ff-ui); color: var(--fg-dim); }
  .sel { width: 260px; justify-content: flex-start; }
  .sel .v { flex: 1; }
  .step { display: inline-flex; align-items: center; gap: 8px; }
  .step .val { min-width: 52px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-2);
               background: var(--bg-2); font: 600 14px/1 var(--ff-mono); color: var(--fg); }
  /* a phone: sections of rows and fields */
  .phone .sec { padding: 14px 16px 6px; }
  .pf { padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 6px; }
  .pf .lbl { font: 500 13px/1.4 var(--ff-ui); color: var(--fg-2); }
  .pf .hint { font: 400 12px/1.45 var(--ff-ui); color: var(--fg-dim); }
  .pf .field { height: 44px; }
  .phone .li .sub { font-size: 12px; }
  .sec.t { padding: 12px 16px 6px; }
  .pf.t { padding-bottom: 8px; }
  .rrow { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-top: 1px solid var(--border); font: 400 14px/1.3 var(--ff-ui); color: var(--fg); }
  .rrow:first-child { border-top: none; }
  .rgrp { border: 1px solid var(--border); background: var(--surface); }
  .vrow { display: flex; align-items: center; justify-content: space-between; }
  .vrow .v { font: 500 14px/1 var(--ff-mono); color: var(--fg-2); }
  /* a TV: rows that take the focus */
  .tset { position: absolute; left: 0; top: 18px; width: 620px; display: flex; flex-direction: column; gap: 18px; }
  .tset .grp { gap: 8px; }
  .trow { height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); }
  .trow .n { flex: 1; font: 500 14px/1.2 var(--ff-ui); color: var(--fg-2); }
  .trow .v { font: 400 14px/1.2 var(--ff-ui); color: var(--fg-2); }
  .trow.focus-row .n, .trow.focus-row .v { color: var(--fg); }
  .tset .hint { font: 400 13px/1.5 var(--ff-ui); color: var(--fg-dim); margin: 2px 0 4px; }
  .trow.who { height: 64px; }
  .trow.who .av { width: 40px; height: 40px; line-height: 40px; font-size: 15px; }
  /* the account */
  .idc { display: flex; align-items: center; gap: 20px; padding: 20px; }
  .idc .nm { font: 500 18px/1.3 var(--ff-ui); color: var(--fg); }
  .idc .em { font: 400 14px/1.4 var(--ff-ui); color: var(--fg-dim); }
  .hist { display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-top: 1px solid var(--border); }
  .hist:first-child { border-top: none; }
  .hist .th { position: relative; height: 56px; flex: none; overflow: hidden; }
  .hist .th.ep { width: 100px; } .hist .th.mv { width: 37px; }
  .hist .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .hist .m .t1 { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .m .t2 { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .d { font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); white-space: nowrap; }
  .wmk { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--signal-green); color: var(--bg); }
  .phone .hist { padding: 8px 16px; gap: 12px; }
  .phone .hist .th { height: 45px; } .phone .hist .th.ep { width: 80px; } .phone .hist .th.mv { width: 30px; }
  .tv .hist { padding: 6px 16px; background: var(--surface); border-top: none; margin-bottom: 6px; }
  .tv .hist .th { height: 45px; } .tv .hist .th.ep { width: 80px; } .tv .hist .th.mv { width: 30px; }
  /* dialogs over the dimmed screen */
  .dlgwrap { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; }
  .phone .scrim-all { top: -56px; bottom: -64px; }
  .phone .dlgwrap { top: -56px; bottom: -64px; }
  .dlg { position: relative; }
  .dlg p:not(.h2) { margin: 0; font: 400 14px/1.5 var(--ff-ui); color: var(--fg-2); }
  .dlg .h2 { padding-right: 36px; }
  .tv .dlg .ft { gap: 16px; }
  .dlg .xb { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); }
  .dlg.w480 { width: 480px; }
  .phone .dlg { width: 312px; }
  .tv .dlg { width: 440px; }
  .goes { margin: 0; padding: 0 0 0 4px; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .goes li { display: flex; align-items: center; gap: 10px; font: 400 14px/1.4 var(--ff-ui); color: var(--fg-2); }
  .goes li::before { content: ""; width: 5px; height: 5px; background: var(--fg-dim); flex: none; }
  .ta { height: 112px; align-items: flex-start; padding-top: 11px; white-space: normal; font-size: 14px; line-height: 1.5; }
  .chk { display: flex; align-items: center; gap: 10px; font: 400 14px/1.3 var(--ff-ui); color: var(--fg-2); }
  .fl { display: flex; flex-direction: column; gap: 8px; }
  .fl .lbl { font: 500 13px/1.4 var(--ff-ui); color: var(--fg-2); }
  .fl .hint { font: 400 12px/1.4 var(--ff-ui); color: var(--fg-dim); }
  .dim { opacity: .55; }
  .tv .banner { font-size: 14px; }
  .cl { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); background: var(--surface); }
  .cl .h3x { font: 600 14px/1.3 var(--ff-mono); color: var(--fg); }
  /* a phone held sideways: the sideways rail also matches screens.css's ".phone > .tabs" (64 px high, a top border), undone here */
  /* settings in two columns, the account beside its history */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; padding: 0 8px; }
  .sgrid .sec { padding: 9px 16px 6px; }
  .sgrid .li { min-height: 52px; }
  .agrid { position: absolute; inset: 0; display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 16px 16px 0 24px; align-items: start; }
  .agrid .acol { display: flex; flex-direction: column; gap: 10px; }
  .agrid .hcol .sec { padding: 0 0 8px; }
  .agrid .hcol .hist { padding: 6px 0; }
  .agrid .hcol .hist .th { height: 45px; } .agrid .hcol .hist .th.ep { width: 80px; } .agrid .hcol .hist .th.mv { width: 30px; }
</style>
</head>
<body>

<!-- Figure 16.1 · settings on a computer -->
<figure class="shot" id="settings-computer">
  <div class="computer" data-view="none">
    <div class="set2">
      <h1 class="h1">settings</h1>
      <div class="colg">
        <section class="grp">
          <h2 class="h2">language</h2>
          <div class="card-box">
            <div class="srow stack">
              <span class="ttl" style="font:500 15px/1.3 var(--ff-ui)">Audio</span>
              <span class="field filled" data-co="1"><span style="flex:1">Original</span><i data-i="chevron-down" class="s16"></i></span>
              <span class="hint" style="font:400 13px/1.5 var(--ff-ui); color:var(--fg-dim)">Titles play with audio in the language you pick here, where they have it. With Original, each title plays in the language it was made in. A choice in the player applies only to what's playing now.</span>
            </div>
            <div class="srow stack">
              <span class="ttl" style="font:500 15px/1.3 var(--ff-ui)">Subtitles</span>
              <span class="field filled" data-co="2"><span style="flex:1">English</span><i data-i="chevron-down" class="s16"></i></span>
              <span class="hint" style="font:400 13px/1.5 var(--ff-ui); color:var(--fg-dim)" data-co="3">Subtitles in the language you pick here come on when a title's audio is in another language. Otherwise, only the foreign-language parts get subtitles, where a title has them. A choice in the player applies only to what's playing now.</span>
            </div>
          </div>
        </section>
      </div>
      <div class="colg">
        <section class="grp">
          <h2 class="h2">binge watching</h2>
          <div class="card-box">
            <div class="srow mid">
              <div class="lab"><span class="ttl">Auto-skip intros</span><span class="hint">Skips the intro and the recap on every episode after the first one you watch in a row.</span></div>
              <span class="switch on" data-co="4" data-co-side="right"></span>
            </div>
            <div class="srow mid">
              <div class="lab"><span class="ttl">Auto-play next episode</span><span class="hint">Starts the next episode when the credits roll. Off, the up next card waits until you play it.</span></div>
              <span class="switch on"></span>
            </div>
            <div class="srow mid">
              <div class="lab"><span class="ttl">Countdown</span><span class="hint">Seconds the player counts down before it skips the intro or the recap, or starts the next episode.</span></div>
              <span class="step" data-co="5" data-co-side="right"><span class="b sm icon"><i data-i="minus" class="s16"></i></span><span class="val">3 s</span><span class="b sm icon"><i data-i="plus" class="s16"></i></span></span>
            </div>
          </div>
        </section>
        <section class="grp">
          <h2 class="h2">feedback</h2>
          <div class="card-box">
            <div class="srow stack" style="gap:12px">
              <span class="hint" style="font:400 14px/1.5 var(--ff-ui); color:var(--fg-2)">Reports go to the people who run this server, with details of the app and the device. Crashes and playback failures are reported on their own.</span>
              <span class="b" style="align-self:flex-start" data-co="6" data-co-side="right"><i data-i="bug" class="s16"></i>report a bug</span>
            </div>
          </div>
        </section>
        <section class="grp">
          <h2 class="h2">about</h2>
          <div class="card-box">
            <div class="srow mid vrow" data-co="7" data-co-side="right"><span class="ttl" style="font:500 15px/1.3 var(--ff-ui)">Version</span><span class="v">0.1.0</span></div>
          </div>
        </section>
      </div>
    </div>
  </div>
</figure>
