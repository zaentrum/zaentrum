<!doctype html>
<!--
  Chapter 16, settings and account: the figures of spec/chino/settings.md (the
  target; the as-deployed figures are screenshots, *-asis-web-*.webp).
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. The design system's components are the <ds-*> tags, which
  ds.js expands into the package's own markup; its card with a title and its
  field around a switch are written in that markup, as ds.js has no tag for them
  yet. What stays chino's own is drawn on its tokens: who is signed in, the
  watch history's rows and the watched mark, and the TV's focus. Pink numbers
  mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 16 settings and account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the toaster is fixed to the window, at its bottom centre, as the design system has it, so it isn't
     moved 80 px right with the page as frame.js moves what is placed against the frame */
  /* settings: the design system's cards, one per group, with its fields, selects and switches inside */
  .stk { display: flex; flex-direction: column; gap: 18px; }
  .stk.tight { gap: 12px; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .short { width: 120px; }
  .set { padding: 28px 48px; display: flex; flex-direction: column; gap: 24px; }
  .set2 { padding: 24px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; align-items: start; }
  .set2 > .nc-heading { grid-column: 1 / -1; margin-bottom: 20px; }
  .colg { display: flex; flex-direction: column; gap: 16px; }
  /* a phone: the cards one under the other */
  .pstk { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sgrid { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  /* a TV: the page's sections, the account a row that takes the focus */
  .tset { position: absolute; left: 0; top: 2px; width: 640px; display: flex; flex-direction: column; gap: 12px; }
  .tset .grp { display: flex; flex-direction: column; gap: 8px; }
  .trow { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border: 1px solid var(--border); }
  .trow .n { font: 500 15px/1.2 var(--ff-ui); color: var(--fg); }
  .trow .v { font: 400 13px/1.3 var(--ff-ui); color: var(--fg-dim); }
  .trow .av { width: 40px; height: 40px; line-height: 40px; font-size: 15px; }
  /* who is signed in, chino's own: the avatar, the name and the email address */
  .idc { display: flex; align-items: center; gap: 20px; }
  .idp { display: flex; align-items: center; gap: 16px; }
  .idp .av { width: 64px; height: 64px; line-height: 64px; font-size: 22px; }
  .idp .av.tvav { width: 56px; height: 56px; line-height: 56px; font-size: 20px; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .who .nm { font: 500 17px/1.3 var(--ff-ui); color: var(--fg); }
  .idc .who .nm { font-size: 18px; }
  .who .em { font: 400 13px/1.4 var(--ff-ui); color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  /* the watch history's rows, chino's own: a still or a poster, the title, the day, the watched mark */
  .hist { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--border); }
  .hist:first-child { border-top: none; }
  .hist .th { position: relative; height: 56px; flex: none; overflow: hidden; }
  .hist .th.ep { width: 100px; } .hist .th.mv { width: 37px; }
  .hist .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .hist .m .t1 { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .m .t2 { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .d { font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); white-space: nowrap; }
  .wmk { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--signal-green); color: var(--bg); }
  .phone .hist { gap: 12px; padding: 8px 12px; }
  .phone .hist .th { height: 45px; } .phone .hist .th.ep { width: 80px; } .phone .hist .th.mv { width: 30px; }
  .tvhist .hist { padding: 6px 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 6px; }
  .tvhist .hist .th { height: 45px; } .tvhist .hist .th.ep { width: 80px; } .tvhist .hist .th.mv { width: 30px; }
  /* a dialog on a TV: the room the design system's TV focus asks for between buttons (12 dp at least), as
     the focused one grows by 5 %; the modal's own footer keeps 8 px */
  .tv .nc-modal__footer { gap: 16px; }
  /* in a dialog: what goes, one line each */
  .nc-modal__body p { margin: 0; }
  .nc-modal__body .stk { gap: 14px; }
  .goes { margin: 0; padding: 0 0 0 4px; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .goes li { display: flex; align-items: center; gap: 10px; }
  .goes li::before { content: ""; width: 5px; height: 5px; background: var(--fg-dim); flex: none; }
  /* a screen before the frame (change server), as chapter 3 draws it */
  .onb { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px; padding: 170px 24px 0; }
  .onb > .mark, .onb > .nc-heading { align-self: center; text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 10px; font: 700 28px/1 var(--ff-mono); color: var(--fg-2); }
  /* who's watching on a TV, under the question */
  .tiles { display: flex; gap: 28px; justify-content: center; }
  .tile { width: 132px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile .av { width: 112px; height: 112px; font-size: 38px; line-height: 112px; }
  .tile .nm { font: 500 15px/1.3 var(--ff-ui); color: var(--fg-2); }
</style>
</head>
