<!doctype html>
<!--
  Chapter 9, search: the target's figures of spec/chino/search.md (its
  as-deployed figures are screenshots). Each <figure class="shot" id="…">
  becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the nalet design system's own stylesheet; the
  <ds-*> tags are the design system's components (ds.js), the frame (top bar
  and its search field, tabs, rail) is frame.js, the icons are icons.js. Pink
  numbers mark the parts the chapter's text explains. What stays chino's own:
  the bar the phone's search opens in place of the top bar, the person cards,
  the posters, the TV's keyboard and the phone's own keyboard.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 9 search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* artwork for the films home doesn't draw (as in chapter 5) */
  .x1 { background: linear-gradient(160deg, #1f5e60 0%, #11332f 55%, #0a1a19 100%); }
  .x5 { background: linear-gradient(160deg, #7a4a5f 0%, #432836 58%, #1f1219 100%); }
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  /* a card's menu: the design system's action menu, its button at the right of the card's lines, as in chapters 4 and 5 */
  .card { position: relative; }
  .card:has(> .nc-actionmenu__trigger) .tt, .card:has(> .nc-actionmenu__trigger) .st { padding-right: 36px; }
  .card > .nc-actionmenu__trigger { position: absolute; right: -4px; bottom: 1px; }
  .phone .grid .card:has(> .nc-actionmenu__trigger) .tt { padding-right: 0; }
  .phone .grid .card:has(> .nc-actionmenu__trigger) .st { padding-right: 26px; }
  .phone .grid .card > .nc-actionmenu__trigger { right: -9px; bottom: -9px; }
  /* the results: cast & crew, then titles */
  .grp { margin-bottom: 32px; }
  .grp .h2 { margin-bottom: 12px; }
  .people { display: flex; gap: 16px; }
  .person { flex: none; width: 260px; display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--border); }
  .person .ph { width: 48px; height: 48px; flex: none; }
  .person .who { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .person .nm { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .sb { font: 500 12px/1.4 var(--ff-mono); color: var(--fg-dim); }
  .computer .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .computer .grid .card.poster { width: auto; } .computer .grid .card.poster .img { height: 233px; }
  /* a phone: the search opens in a bar of its own, in place of the top bar,
     the back arrow as the frame draws it and the design system's input */
  .sbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 6px; background: var(--bg-2); border-bottom: 1px solid var(--border); position: relative; z-index: 10; }
  .sbar .fw { flex: 1; min-width: 0; position: relative; }
  .sbar .fw .xb { position: absolute; right: 4px; top: 4px; }
  .phone .pg { padding: 16px; }
  .phone .person { width: 248px; }
  .phone .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
  .phone .grid .card.poster { width: auto; } .phone .grid .card.poster .img { height: 152px; }
  .phone .grid .card .tt { font-size: 13px; }
  .phone .grp { margin-bottom: 24px; }
  /* the page under the open field: home, as chapter 4 draws it */
  .phone .hero { position: relative; height: 392px; }
  .phone .hero .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .phone .hero .row > .nc-btn { flex: 1 1 auto; }
  .phone .t { font-size: 26px; } .phone .meta { font-size: 12px; }
  .phone .entry { margin: 16px 16px 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
                  border: 1px solid var(--border-2); background: var(--surface); font: 600 14px/1 var(--ff-mono); }
  .phone .entry .chev { margin-left: auto; color: var(--fg-dim); }
  .phone .shelf { padding: 20px 0 0 16px; }
  .shelf .h2 { margin-bottom: 12px; }
  .phone .shelf .card { width: 200px; } .phone .shelf .card .img { height: 112px; }
  .phone.side .hero { height: 196px; }
  .phone.side .hero .txt { left: 16px; right: auto; top: 18px; bottom: auto; width: 420px; gap: 8px; }
  /* the phone's own keyboard */
  .oskb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 4px 14px; background: #1B202A; border-top: 1px solid var(--border);
          display: flex; flex-direction: column; gap: 10px; }
  .oskb .r { display: flex; justify-content: center; gap: 4px; }
  .oskb .k { width: 31px; height: 42px; display: inline-flex; align-items: center; justify-content: center; background: #2B3140; color: var(--fg-2); font: 400 17px/1 var(--ff-ui); }
  .oskb .k.m { width: 44px; background: #222836; font-size: 13px; }
  .oskb .k.sp { width: 158px; }
  .oskb .k.go { width: 58px; background: #3A4256; }
  /* a TV: the field, the keyboard on the left, what it found on the right */
  .tv .inner { width: 768px; padding-top: 4px; }
  .tvs { display: flex; gap: 32px; margin-top: 18px; }
  /* the TV's own keyboard: the design system has none; the keys at the TV's
     control height, 42 dp, 12 dp apart, in the look of its standard buttons */
  .keys { flex: none; display: grid; grid-template-columns: repeat(6, 42px); gap: 12px; }
  .key { height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-2);
         font: 600 15px/1 var(--ff-mono); color: var(--fg-2); }
  .key.w { grid-column: span 3; font-size: 13px; }
  .tv .key.focus { background: var(--surface-focus); color: var(--fg); }
  .tv .res { flex: 1; min-width: 0; }
  .tv .res .h2 { margin-bottom: 10px; }
  .tv .res .card.poster { width: 136px; } .tv .res .card.poster .img { height: 204px; }
  /* grey blocks in the shape of the results */
  .card .ln { height: 12px; margin-top: 10px; width: 80%; }
  .card .ln2 { height: 10px; margin-top: 6px; width: 40px; }
  /* a phone held sideways (780 × 360, the tabs a rail on the left): the bar
     slimmer, the posters at their upright size, so six to a line */
  .phone.side .sbar { height: 48px; }
  .phone.side .sbar .fw .xb { top: 4px; }
  .phone.side .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 12px; }
  .phone.side .grid .card.poster .img { height: 152px; }
  .phone.side .grp .h2 { display: inline-block; padding-right: 10px; }
  /* the phone's own keyboard held sideways: wider keys, a lower block */
  .phone.side .oskb { padding: 8px 6px 10px; gap: 8px; }
  .phone.side .oskb .r { gap: 6px; }
  .phone.side .oskb .k { width: 70px; height: 38px; }
  .phone.side .oskb .k.m { width: 100px; }
  .phone.side .oskb .k.sp { width: 300px; }
  .phone.side .oskb .k.go { width: 120px; }
</style>
</head>
