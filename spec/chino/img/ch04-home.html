<!doctype html>
<!--
  Chapter 4, home: the figures of spec/chino/home.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet, the design
  system's components are the <ds-*> tags (ds.js), the frame (top bar, tabs,
  rail) is frame.js, the icons are icons.js. Pink numbers mark the parts the
  chapter's text explains. chino's own: the hero, its squares, the rows of cards,
  the zap entry and the loading blocks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 4 home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  .computer .hero { position: relative; height: 384px; }
  /* 74 down, so the lines of marks 2 and 3 pass between the rail's icons; mark 1 meets the name's end */
  .computer .hero .txt { position: relative; padding: 74px 48px 0; width: 600px; display: flex; flex-direction: column; gap: 14px; }
  .computer .hero .t { align-self: flex-start; }
  .computer .hero .row { margin-top: 6px; }
  .computer .shelf { padding: 0 48px; margin-bottom: 28px; }
  .shelf .h2 { margin-bottom: 12px; }
  /* a card's menu: the design system's action menu, its button at the right of the card's lines, under the still */
  .card { position: relative; }
  .card:has(> .nc-actionmenu__trigger) .tt, .card:has(> .nc-actionmenu__trigger) .st { padding-right: 36px; }
  .card > .nc-actionmenu__trigger { position: absolute; right: -4px; bottom: 1px; }
  .phone .hero { position: relative; height: 392px; }
  .phone .hero .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .phone .t { font-size: 26px; } .phone .meta { font-size: 12px; }
  .phone .hero .row > .nc-btn { flex: 1 1 auto; }
  .phone .entry { margin: 16px 16px 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
                  border: 1px solid var(--border-2); background: var(--surface); font: 600 14px/1 var(--ff-mono); }
  .phone .entry .chev { margin-left: auto; color: var(--fg-dim); }
  .phone .shelf { padding: 20px 0 0 16px; }
  .phone .card { width: 200px; } .phone .card .img { height: 112px; }
  /* a phone held sideways: the hero no taller than the screen, its words left of the artwork. */
  .phone.side .hero { height: 196px; }
  .phone.side .hero .txt { left: 16px; right: auto; top: 18px; bottom: auto; width: 420px; gap: 8px; }
  .phone.side .hero .row { margin-top: 4px; }
  .phone.side .hero .row > .nc-btn { flex: none; }
  .phone.side .hero .dots { margin-top: 6px; }
  .phone.side .entry { margin: 12px 16px 0; }
  .phone.side .shelf { padding-top: 16px; }
  .tv .backdrop { position: absolute; left: 0; right: 0; top: 0; height: 372px; }
  .tv .backdrop .scrim { position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--bg) 0%, rgba(11,15,25,.95) 24%, rgba(11,15,25,.5) 52%, rgba(11,15,25,0) 74%), linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,0) 40%); }
  .tv .txt { position: absolute; left: 132px; top: 50px; width: 470px; display: flex; flex-direction: column; gap: 10px; }
  .tv .txt .row { margin-top: 6px; gap: 12px; }
  .tv .shelf { position: absolute; left: 132px; top: 330px; }
  .tv .shelf .h2 { margin-bottom: 10px; }
  /* a state in the content's place: the design system's empty state, centred */
  .state { display: flex; justify-content: center; }
</style>
</head>
<body>

<!-- Figure 4.5 · home on a computer, the menu of Elephants Dream open -->
<figure class="shot" id="home-computer">
  <div class="computer" data-view="home">
    <section class="hero">
      <div class="art steel"></div><div class="scrim-l"></div>
      <div class="txt">
        <h1 class="t" data-co="1" data-co-side="right">Tears of Steel</h1>
        <p class="meta">2012 · 12 min · science fiction</p>
        <p class="desc">In a future Amsterdam, a group of scientists tries to save the world from robots by staging one moment from the past again.</p>
        <div class="row" data-co="2"><ds-button variant="primary" icon="play">play</ds-button><ds-button>see details</ds-button><ds-button icon="clapperboard">trailer</ds-button></div>
        <div class="dots" data-co="3"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </section>
    <section class="shelf">
      <h2 class="h2" data-co="4">continue watching</h2>
      <div class="cards">
        <div class="card"><div class="img"><div class="art a1"></div><div class="bar"><i style="width:42%"></i></div></div><div class="tt">Pioneer One</div><div class="st">S01E03 · 24 min left</div><ds-menubutton size="md" label="actions for Pioneer One"></ds-menubutton></div>
        <div class="card"><div class="img"><div class="art a2"></div><div class="bar"><i style="width:36%"></i></div></div><div class="tt">Sintel</div><div class="st">9 min left</div><ds-menubutton size="md" label="actions for Sintel"></ds-menubutton></div>
        <div class="card"><div class="img"><div class="art a4"></div><div class="bar"><i style="width:68%"></i></div></div><div class="tt">Cosmos Laundromat</div><div class="st">4 min left</div><ds-menubutton size="md" label="actions for Cosmos Laundromat"></ds-menubutton></div>
        <div class="card"><div class="img"><div class="art a5"></div><div class="bar"><i style="width:28%"></i></div></div><div class="tt">Elephants Dream</div><div class="st">8 min left</div><ds-menubutton size="md" label="actions for Elephants Dream" open></ds-menubutton>
          <ds-menu style="top: calc(100% + 5px); right: 0" data-co="6" data-co-side="right"><ds-item icon="play">resume</ds-item><ds-item icon="check">mark as watched</ds-item><ds-item icon="x" danger>remove from continue watching</ds-item></ds-menu></div>
        <div class="card"><div class="img"><div class="art a6"></div><div class="bar"><i style="width:55%"></i></div></div><div class="tt">Sprite Fright</div><div class="st">5 min left</div><ds-menubutton size="md" label="actions for Sprite Fright"></ds-menubutton></div>
      </div>
    </section>
    <section class="shelf">
      <h2 class="h2" data-co="5">next up</h2>
      <div class="cards">
        <div class="card"><div class="img"><div class="art a3"></div></div><div class="tt">Caminandes</div><div class="st">S01E02 · Gran Dillama</div><ds-menubutton size="md" label="actions for Caminandes"></ds-menubutton></div>
        <div class="card"><div class="img"><div class="art a1"></div></div></div>
        <div class="card"><div class="img"><div class="art a5"></div></div></div>
        <div class="card"><div class="img"><div class="art a2"></div></div></div>
        <div class="card"><div class="img"><div class="art a4"></div></div></div>
      </div>
    </section>
  </div>
</figure>
