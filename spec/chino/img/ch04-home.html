<!doctype html>
<!--
  Chapter 4, home: the figures of spec/chino/home.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 4 home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  .computer .hero { position: relative; height: 384px; }
  .computer .hero .txt { position: relative; padding: 60px 48px 0; width: 600px; display: flex; flex-direction: column; gap: 14px; }
  .computer .hero .row { margin-top: 6px; }
  .computer .shelf { padding: 0 48px; margin-bottom: 28px; }
  .shelf .h2 { margin-bottom: 12px; }
  /* a card's menu: its button beside the name, under the artwork (chapter 6) */
  .card { position: relative; }
  .card:has(> .mn) .tt, .card:has(> .mn) .st { padding-right: 30px; }
  .card .mn { position: absolute; right: -6px; bottom: -2px; width: 32px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--fg-dim); }
  .phone .hero { position: relative; height: 392px; }
  .phone .hero .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .phone .t { font-size: 26px; } .phone .meta { font-size: 12px; }
  .phone .hero .row > .b { flex: 1; padding: 0 12px; }
  .phone .entry { margin: 16px 16px 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
                  border: 1px solid var(--border-2); background: var(--surface); font: 600 14px/1 var(--ff-mono); }
  .phone .entry .chev { margin-left: auto; color: var(--fg-dim); }
  .phone .shelf { padding: 20px 0 0 16px; }
  .phone .card { width: 200px; } .phone .card .img { height: 112px; }
  /* a phone held sideways: the hero no taller than the screen, its words left of the artwork. */
  .phone.side .hero { height: 196px; }
  .phone.side .hero .txt { left: 16px; right: auto; top: 18px; bottom: auto; width: 400px; gap: 8px; }
  .phone.side .hero .row { margin-top: 4px; }
  .phone.side .hero .row > .b { flex: none; padding: 0 16px; }
  .phone.side .hero .dots { margin-top: 6px; }
  .phone.side .entry { margin: 12px 16px 0; }
  .phone.side .shelf { padding-top: 16px; }
  .tv .backdrop { position: absolute; left: 0; right: 0; top: 0; height: 372px; }
  .tv .backdrop .scrim { position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--bg) 0%, rgba(11,15,25,.95) 24%, rgba(11,15,25,.5) 52%, rgba(11,15,25,0) 74%), linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,0) 40%); }
  .tv .txt { position: absolute; left: 132px; top: 52px; width: 460px; display: flex; flex-direction: column; gap: 10px; }
  .tv .txt .row { margin-top: 6px; gap: 12px; }
  .tv .shelf { position: absolute; left: 132px; top: 330px; }
  .tv .shelf .h2 { margin-bottom: 10px; }
</style>
</head>
<body>

<!-- Figure 4.5 · home on a computer -->
<figure class="shot" id="home-computer">
  <div class="computer" data-view="home">
    <section class="hero">
      <div class="art steel"></div><div class="scrim-l"></div>
      <div class="txt">
        <h1 class="t" data-co="1">Tears of Steel</h1>
        <p class="meta">2012 · 12 min · science fiction</p>
        <p class="desc">In a future Amsterdam, a group of scientists tries to save the world from robots by staging one moment from the past again.</p>
        <div class="row" data-co="2"><span class="b primary"><i data-i="play" class="fill"></i>play</span><span class="b">see details</span><span class="b"><i data-i="clapperboard"></i>trailer</span></div>
        <div class="dots" data-co="3"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </section>
    <section class="shelf">
      <h2 class="h2" data-co="4">continue watching</h2>
      <div class="cards">
        <div class="card"><div class="img"><div class="art a1"></div><div class="bar"><i style="width:42%"></i></div></div><div class="tt">Pioneer One</div><div class="st">S01E03 · 24 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a2"></div><div class="bar"><i style="width:36%"></i></div></div><div class="tt">Sintel</div><div class="st">9 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a4"></div><div class="bar"><i style="width:68%"></i></div></div><div class="tt">Cosmos Laundromat</div><div class="st">4 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a5"></div><div class="bar"><i style="width:28%"></i></div></div><div class="tt">Elephants Dream</div><div class="st">8 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a6"></div><div class="bar"><i style="width:55%"></i></div></div><div class="tt">Sprite Fright</div><div class="st">5 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
      </div>
    </section>
    <section class="shelf">
      <h2 class="h2" data-co="5">next up</h2>
      <div class="cards">
        <div class="card"><div class="img"><div class="art a3"></div></div><div class="tt">Caminandes</div><div class="st">S01E02 · Gran Dillama</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a1"></div></div></div>
        <div class="card"><div class="img"><div class="art a5"></div></div></div>
        <div class="card"><div class="img"><div class="art a2"></div></div></div>
        <div class="card"><div class="img"><div class="art a4"></div></div></div>
      </div>
    </section>
  </div>
</figure>

        <div class="card"><div class="img"><div class="art a1"></div><div class="bar"><i style="width:42%"></i></div></div><div class="tt">Pioneer One</div><div class="st">S01E03 · 24 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>
        <div class="card"><div class="img"><div class="art a2"></div><div class="bar"><i style="width:36%"></i></div></div><div class="tt">Sintel</div><div class="st">9 min left</div><span class="mn"><i data-i="ellipsis-vertical" class="s16"></i></span></div>

    </section>
  </div>
</figure>

<!-- Figure 4.9 · home loading, on a phone -->
<figure class="shot" id="home-loading-phone">
  <div class="phone" data-view="home">
    <div class="sk" style="height:392px"></div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div class="sk" style="height:48px"></div>
      <div class="sk" style="height:18px;width:170px;margin-top:10px"></div>
