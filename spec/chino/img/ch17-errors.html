<!doctype html>
<!--
  Chapter 17, when something goes wrong: the figures of spec/chino/errors.md,
  drawn on the design system's components (<ds-*> tags, ds.js): a page or a
  list that couldn't load is its empty state with the error drawing and try
  again; a part of a page that couldn't load is its error banner; removed has
  the empty drawing, no access the error drawing, each with back.
  Every phone screen is drawn held upright (<div class="phone">, 360 × 780) and
  sideways (<div class="phone side">, 780 × 360, the tabs as a rail on the left).
  Figures 17.1 to 17.3 are screenshots of the deployed web, not drawings.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet, the frame (top
  bar, tabs, rail) is frame.js, the icons are icons.js. Home in the row's
  figure is chapter 4's (ch04-home.html).
  The empty state has no details of its own: they are drawn with the banner's
  details toggle and text (nc-strip__toggle, nc-strip__details) under its
  button, chino's own way of putting them there.
  Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 17 when something goes wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the empty state in the page's place, centred: under the computer's bar, in
     the phone's scroll area, and on a TV right of the rail inside the safe area */
  /* the page's place beside the rail: frame.js moves what is placed against the frame 80 px right with the page */
  .computer .mid { position: absolute; left: 0; right: 80px; top: 56px; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .phone .mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .tv .page .mid { position: absolute; left: 0; right: 48px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }

  /* details under the empty state's button: the banner's toggle and its text,
     its rule in the border colour (the empty state has no state colour of its own) */
  .det { flex-basis: 100%; display: flex; flex-direction: column; align-items: center; --nc-strip-border: var(--border-2); }
  .det .nc-strip__details { text-align: left; }
  /* on a TV the details show without a toggle, in the quiet monospace */
  .det-b { flex-basis: 100%; margin: 4px 0 0; font: 500 12px/1.5 var(--ff-mono); color: var(--fg-dim); }
  /* the one focused button on a TV: a plain button gets the focused surface (the TV focus pattern) */

  /* home on a phone, as chapter 4 draws it, scrolled down to its rows */
  .phone .hero { position: relative; height: 392px; }
  .phone .hero .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .phone .t { font-size: 26px; } .phone .meta { font-size: 12px; }
  .phone .entry { margin: 16px 16px 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
                  border: 1px solid var(--border-2); background: var(--surface); font: 600 14px/1 var(--ff-mono); }
  .phone .entry .chev { margin-left: auto; color: var(--fg-dim); }
  .phone .shelf { padding: 20px 16px 0; }
  .shelf .h2 { margin-bottom: 12px; }
  .phone .shelf .cards { margin-right: -16px; }
  .phone .card { width: 200px; } .phone .card .img { height: 112px; }
  .scrolled { margin-top: -236px; }

  /* held sideways */
  .side .shelf { padding: 16px 24px 0; }
  .side .shelf .cards { margin-right: -24px; }
  .side .shelf .h2 { width: fit-content; }
  .side .card { width: 176px; } .side .card .img { height: 99px; }
</style>
</head>
<body>

<!-- Figure 17.4 · a page that couldn't load, on a computer -->
<figure class="shot" id="errors-page-computer">
  <div class="computer" data-view="none">
    <div class="mid">
      <ds-empty illustration="error" size="lg" title='<span data-co="1">couldn&#39;t load this title</span>' description='<span data-co="2">The server ran into a problem.</span>'>
        <ds-button data-co="3">try again</ds-button>
        <div class="det"><button type="button" class="nc-strip__toggle" aria-expanded="true" data-co="4"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true" class="nc-strip__caret"><path d="M4 2.5 L7.5 6 L4 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>details</button><div class="nc-strip__details">HTTP 500 Internal Server Error</div></div>
      </ds-empty>
    </div>
  </div>
</figure>

<!-- Figure 17.5 · a page that couldn't load, on a phone held upright -->
<figure class="shot" id="errors-page-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="" data-co-parts="back:1">
    <div class="mid">
      <ds-empty illustration="error" size="lg" title="couldn't load this title" description="The server is busy.">
        <ds-button size="lg">try again</ds-button>
        <div class="det"><button type="button" class="nc-strip__toggle" aria-expanded="false" data-co="2"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true" class="nc-strip__caret"><path d="M4 2.5 L7.5 6 L4 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>details</button></div>
      </ds-empty>
    </div>
  </div>
</figure>

<!-- Figure 17.7 · a page that couldn't load, on a TV -->
<figure class="shot" id="errors-page-tv">
  <div class="tv" data-view="none">
    <div class="page">
      <div class="mid">
        <ds-empty illustration="error" size="lg" title="couldn't load this title" description="The server didn't accept the request. Check for an app update.">
          <ds-button size="lg" class="focus" data-co="1" data-co-side="right">try again</ds-button>
          <p class="det-b"><span data-co="2" data-co-side="right">HTTP 400 Bad Request</span></p>
        </ds-empty>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 17.8 · a part of a page that couldn't load: a row of home, on a phone held upright -->
<figure class="shot" id="errors-row-phone">
  <div class="phone" data-view="home">
    <div class="scrolled">
      <section class="hero">
        <div class="art steel"></div><div class="scrim-b"></div>
        <div class="txt">
          <h1 class="t">Tears of Steel</h1>
          <p class="meta">2012 · 12 min · science fiction</p>
          <div class="row"><ds-button size="lg" variant="primary" icon="play">play</ds-button><ds-button size="lg">see details</ds-button><ds-iconbutton size="lg" icon="clapperboard" label="play the trailer"></ds-iconbutton></div>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </section>
      <div class="entry"><i data-i="zap"></i>zap<i data-i="chevron-right" class="chev"></i></div>
      <section class="shelf">
        <h2 class="h2">continue watching</h2>
        <ds-banner state="error" action='<span data-co="2">try again</span>' details="HTTP 500 Internal Server Error"><span data-co="1">Couldn't load continue watching.</span> The server ran into a problem.</ds-banner>
      </section>
      <section class="shelf">
        <h2 class="h2" data-co="3">recently added movies</h2>
        <div class="cards">
          <div class="card"><div class="img"><div class="art a6"></div></div><div class="tt">Charge</div></div>
          <div class="card"><div class="img"><div class="art a2"></div></div><div class="tt">Coffee Run</div></div>
        </div>
      </section>
    </div>
  </div>
</figure>

<!-- Figure 17.10 · a title that was removed, on a phone held upright -->
<figure class="shot" id="errors-removed-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="">
    <div class="mid">
      <ds-empty illustration="empty" size="lg" title='<span data-co="1">this title isn&#39;t in the library anymore</span>'>
        <ds-button size="lg" data-co="2">back</ds-button>
      </ds-empty>
    </div>
  </div>
</figure>

<!-- Figure 17.12 · no access, on a TV -->
<figure class="shot" id="errors-no-access-tv">
  <div class="tv" data-view="none">
    <div class="page">
      <div class="mid">
        <ds-empty illustration="error" size="lg" title='<span data-co="1" data-co-side="right">you don&#39;t have access to this</span>'>
          <ds-button size="lg" class="focus" data-co="2" data-co-side="right">back</ds-button>
        </ds-empty>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 17.6 · a page that couldn't load, on a phone held sideways -->
<figure class="shot" id="errors-page-side-phone">
  <div class="phone side" data-view="none" data-bar="back" data-title="" data-co-parts="back:1">
    <div class="mid">
      <ds-empty illustration="error" size="sm" title='<span data-co="2" data-co-side="right">couldn&#39;t load this title</span>' description="The server is busy.">
        <ds-button size="lg">try again</ds-button>
        <div class="det"><button type="button" class="nc-strip__toggle" aria-expanded="false"><svg viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true" class="nc-strip__caret"><path d="M4 2.5 L7.5 6 L4 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>details</button></div>
      </ds-empty>
    </div>
  </div>
</figure>

<!-- Figure 17.9 · a part of a page that couldn't load: a row of home, on a phone held sideways -->
<figure class="shot" id="errors-row-side-phone">
  <div class="phone side" data-view="home">
    <section class="shelf">
      <h2 class="h2">continue watching</h2>
      <ds-banner state="error" action="try again" details="HTTP 500 Internal Server Error" data-co="1" data-co-side="right">Couldn't load continue watching. The server ran into a problem.</ds-banner>
    </section>
    <section class="shelf">
      <h2 class="h2" data-co="2" data-co-side="right">recently added movies</h2>
      <div class="cards">
        <div class="card"><div class="img"><div class="art a6"></div></div><div class="tt">Charge</div></div>
        <div class="card"><div class="img"><div class="art a2"></div></div><div class="tt">Coffee Run</div></div>
        <div class="card"><div class="img"><div class="art a4"></div></div><div class="tt">Sprite Fright</div></div>
      </div>
    </section>
  </div>
</figure>

<!-- Figure 17.11 · a title that was removed, on a phone held sideways -->
<figure class="shot" id="errors-removed-side-phone">
  <div class="phone side" data-view="none" data-bar="back" data-title="">
    <div class="mid">
      <ds-empty illustration="empty" size="sm" title='<span data-co="1" data-co-side="right">this title isn&#39;t in the library anymore</span>'>
        <ds-button size="lg" data-co="2" data-co-side="right">back</ds-button>
      </ds-empty>
    </div>
  </div>
</figure>

<script src="ds.js"></script>

<script src="frame.js"></script>
</body>
</html>
