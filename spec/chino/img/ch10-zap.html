<!doctype html>
<!--
  Chapter 10, zap: the figures of docs/chino/zap.md.
  Each <figure class="shot" id="…"> becomes docs/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
  The card is the owner's design of 2026-10-05: the clip whole in the middle
  over its own light; at the foot the title, year and rating and three lines
  of the overview on the left, save over watch on the right.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 10 zap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the card: its light, the clip, the foot */
  .card-z { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; background: #000; }
  .computer .card-z { top: 56px; }
  .card-z .light { position: absolute; inset: -12%; filter: blur(44px) saturate(1.15); }
  .card-z .veil { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .card-z .clip { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .card-z .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 16px;
                  padding: 48px 16px 20px 20px; background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%); }
  .card-z .info { flex: 1; min-width: 0; }
  .card-z .info > .in { max-width: 560px; display: flex; flex-direction: column; gap: 6px; }
  .card-z .ttl { margin: 0; font: 600 22px/28px var(--ff-mono); color: #fff; }
  .card-z .ym { display: flex; gap: 6px; font: 500 13px/1.3 var(--ff-ui); color: var(--fg-2); }
  .card-z .ym .r { color: var(--cloud-blue); }
  .card-z .ov { margin: 0; font: 400 13px/19px var(--ff-ui); color: var(--fg-2);
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-z .col2 { flex: none; display: flex; flex-direction: column; gap: 14px; }
  .sq { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center;
        background: var(--surface-2); border: 1px solid var(--border-2); color: var(--fg); }
  .sq svg.i { width: 24px; height: 24px; }

  /* the TV: the scene full screen, the info on a solid band out to the edges */
  .tv .scene { position: absolute; inset: 0; }
  .tv .band { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 24px 48px 27px; }
  .tv .zinfo { display: flex; flex-direction: column; gap: 10px; }
  .tv .zinfo .t { font-size: 28px; }
  .tv .zinfo .ym { display: flex; gap: 10px; font: 500 14px/1.3 var(--ff-ui); color: var(--fg-2); }
  .tv .zinfo .ym .r { color: var(--cloud-blue); }
  .tv .zinfo .desc { width: 60%; }
  .tv .keys { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 500 12px/22px var(--ff-mono); color: var(--fg-muted); margin-top: 2px; }
  .tv .keys > span { display: inline-flex; align-items: center; gap: 6px; }
  .tv .keys .kbd { height: 20px; min-width: 20px; font-size: 10px; }
  .tv .chip svg.i { width: 16px; height: 16px; }

  /* the states */
  .sk-sq { width: 48px; height: 48px; }
</style>
</head>
<body>

<!-- Figure 10.1 · zap on a computer -->
<figure class="shot" id="zap-computer">
  <div class="computer" data-view="zap">
    <div class="card-z">
      <div class="light"><div class="art a2"></div></div>
      <div class="veil"></div>
      <div class="clip" data-co="2"><div class="art a2"></div></div>
      <div style="position:absolute;left:300px;right:300px;top:2px;height:8px" data-co="1"></div>
      <div class="foot">
        <div class="info"><div class="in">
          <h2 class="ttl" data-co="3">Sintel</h2>
          <div class="ym"><span>2010</span><span class="r">★ 7.4</span></div>
          <p class="ov" data-co="4">A lonely young woman, Sintel, helps and befriends a dragon, whom she calls Scales. But when he is kidnapped by an adult dragon, Sintel sets out on a dangerous quest to find her lost friend.</p>
        </div></div>
        <div class="col2">
          <span class="sq" data-co="5" data-co-side="right"><i data-i="bookmark"></i></span>
          <span class="sq" data-co="6" data-co-side="right"><i data-i="maximize"></i></span>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 10.2 · zap on a phone -->
<figure class="shot" id="zap-phone">
  <div class="phone" data-bar="none" data-tabs="none" data-view="none">
    <div class="card-z">
      <div class="light"><div class="art steel"></div></div>
      <div class="veil"></div>
      <div style="position:absolute;left:40px;right:40px;top:120px;height:60px" data-co="1"></div>
      <div class="clip" data-co="2"><div class="art steel"></div></div>
      <div class="foot">
        <div class="info" data-co="3"><div class="in">
          <h2 class="ttl">Tears of Steel</h2>
          <div class="ym"><span>2012</span><span class="r">★ 6.6</span></div>
          <p class="ov">In a future Amsterdam, a group of scientists tries to save the world from robots by staging one moment from the past again.</p>
        </div></div>
        <div class="col2" data-co="4" data-co-side="right">
          <span class="sq"><i data-i="bookmark"></i></span>
          <span class="sq"><i data-i="maximize"></i></span>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 10.3 · zap on a TV: the scene alone -->
<figure class="shot" id="zap-tv">
  <div class="tv full" data-rail="none" data-view="none">
    <div class="scene"><div class="art a4"></div></div>
  </div>
</figure>

<!-- Figure 10.4 · the TV's info -->
<figure class="shot" id="zap-info-tv">
  <div class="tv full" data-rail="none" data-view="none">
    <div class="scene"><div class="art a4"></div></div>
    <div class="band"><div style="position:absolute;right:0;top:0;width:40px;height:20px" data-co="5" data-co-side="right"></div>
    <div class="zinfo">
      <div class="row" style="gap:16px">
        <h1 class="t" data-co="1">Cosmos Laundromat</h1>
        <span class="chip" data-co="2" data-co-side="right"><i data-i="bookmark"></i>add to Watchlist</span>
      </div>
      <div class="ym"><span>2015</span><span class="r">★ 7.0</span></div>
      <p class="desc" data-co="3">On a desolate island, a suicidal sheep called Franck meets his fate in a quirky salesman, who offers him the gift of a lifetime.</p>
      <div class="keys" data-co="4">
        <span><b class="kbd">OK</b>watch from here</span>
        <span><b class="kbd">▼</b><b class="kbd">CH+</b>next</span>
        <span><b class="kbd">CH−</b>previous</span>
        <span><b class="kbd">▲</b>info</span>
        <span><b class="kbd">◀</b>mute</span>
        <span><b class="kbd">▶</b>Watchlist</span>
      </div>
    </div></div>
  </div>
</figure>

<!-- Figure 10.5 · zap loading, on a phone -->
<figure class="shot" id="zap-loading-phone">
  <div class="phone" data-bar="none" data-tabs="none" data-view="none">
    <div class="sk" style="position:absolute;left:0;right:0;top:289px;height:202px"></div>
    <div style="position:absolute;left:20px;right:16px;bottom:20px;display:flex;align-items:flex-end;gap:16px">
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div class="sk" style="height:22px;width:170px"></div>
        <div class="sk" style="height:13px;width:90px"></div>
        <div class="sk" style="height:12px;width:250px;margin-top:4px"></div>
        <div class="sk" style="height:12px;width:240px"></div>
        <div class="sk" style="height:12px;width:150px"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px"><div class="sk sk-sq"></div><div class="sk sk-sq"></div></div>
    </div>
  </div>
</figure>

<!-- Figure 10.6 · zap couldn't load, on a computer -->
<figure class="shot" id="zap-couldnt-load-computer">
  <div class="computer" data-view="zap">
    <div class="empty" style="margin-top:250px">
      <i data-i="cloud-off" class="s48"></i>
      <h2 class="h2" data-co="1">couldn't load the movies and shows</h2>
      <p class="text">Can't reach the server.</p>
      <span class="b" style="margin-top:6px" data-co="2"><i data-i="refresh-cw" class="s16"></i>try again</span>
    </div>
  </div>
</figure>

<!-- Figure 10.7 · nothing to zap, on a TV -->
<figure class="shot" id="zap-empty-tv">
  <div class="tv full" data-rail="none" data-view="none">
    <div class="page">
      <div class="empty" style="margin-top:176px">
        <i data-i="zap" class="s48"></i>
        <h2 class="h2">nothing to zap yet</h2>
        <p class="text" style="max-width:480px">Zap plays the movies and shows you haven't watched yet.</p>
      </div>
    </div>
  </div>
</figure>

<script src="frame.js"></script>
</body>
</html>
