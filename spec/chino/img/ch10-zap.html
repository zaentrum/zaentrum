<!doctype html>
<!--
  Chapter 10, zap: the target figures of spec/chino/zap.md. The as-deployed
  figures (zap-asis-web-*.png) are screenshots, not drawn here.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet under it; the
  design system's components are the <ds-*> tags ds.js expands; the frame (top
  bar, tabs, rail) is frame.js; the icons are icons.js. Pink numbers mark the
  parts the chapter's text explains.
  The card is chino's own, the owner's design of 2026-10-05: the clip whole in
  the middle over its own light; at the foot the title, year and rating and
  three lines of the overview on the left, save over watch on the right as the
  design system's icon buttons (the standard kind, 34 on a computer, 42 on a
  phone). Held sideways (a card less than 400 high) the foot keeps the title to
  one line and leaves the overview out, and its scrim keeps to the text's
  height. The TV's info is chino's own too, with the design system's key caps.
  Loading is grey blocks in the card's shape; couldn't load and nothing to zap
  are the design system's empty states.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 10 zap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the card: its light, the clip, the foot */
  .card-z { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; background: #000; }
  /* on a computer the card fills the page beside the rail: frame.js moves what is placed against the
     frame 80 px right with the page, so it ends 80 short of the frame's right edge */
  .computer .card-z { top: 56px; right: 80px; }
  .card-z .light { position: absolute; inset: -12%; filter: blur(44px) saturate(1.15); }
  .card-z .veil { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .card-z .clip { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .card-z .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 16px;
                  padding: 48px 16px 20px 20px; background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%); }
  .computer .card-z .foot { padding-right: 24px; }
  .card-z .info { flex: 1; min-width: 0; }
  .card-z .info > .in { max-width: 560px; display: flex; flex-direction: column; gap: 6px; }
  .card-z .ttl { margin: 0; font: 600 22px/28px var(--ff-mono); color: #fff; }
  .card-z .ym { display: flex; gap: 6px; font: 500 13px/1.3 var(--ff-ui); color: var(--fg-2); }
  .card-z .ym .r { color: var(--cloud-blue); }
  .card-z .ov { margin: 0; font: 400 13px/19px var(--ff-ui); color: var(--fg-2);
                display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* save over watch: the design system's icon buttons, 12 apart */
  .card-z .col2 { flex: none; display: flex; flex-direction: column; gap: 12px; }

  /* the phone held sideways: the clip as high as the card, the light in the
     bands beside it, the foot on one line and its scrim no taller than it */
  .phone.side .card-z .clip { left: 50%; right: auto; top: 0; bottom: 0; height: 100%; transform: translateX(-50%); }
  .phone.side .card-z .foot { padding-top: 20px;
                              background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.6) 30%, rgba(0,0,0,0) 62%); }
  .card-z .ttl.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* the TV: the scene full screen, the info on a solid band out to the edges */
  .tv .scene { position: absolute; inset: 0; }
  .tv .band { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 24px 48px 27px; }
  .tv .zinfo { display: flex; flex-direction: column; gap: 10px; }
  .tv .zinfo .t { font-size: 28px; }
  .tv .zinfo .ym { display: flex; gap: 10px; font: 500 14px/1.3 var(--ff-ui); color: var(--fg-2); }
  .tv .zinfo .ym .r { color: var(--cloud-blue); }
  .tv .zinfo .desc { width: 60%; }
  .tv .chip svg.i { width: 16px; height: 16px; }
  /* the keys: each the design system's key cap, then what it does; "or" joins two keys that do the same */
  .tv .keys { display: flex; flex-wrap: wrap; gap: 6px 20px; font: 500 12px/22px var(--ff-mono); color: var(--fg-muted); margin-top: 2px; }
  .tv .keys > span { display: inline-flex; align-items: center; gap: 6px; }
  .tv .keys .or { font: 400 12px/1 var(--ff-ui); color: var(--fg-dim); }

  /* the states: grey blocks in the card's shape; the design system's empty state in place of the card */
  .sk-sq { width: 42px; height: 42px; }
  .state { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .computer .state { top: 56px; right: 80px; }   /* the page beside the rail, as the card */
  /* the empty state hugs its widest line, its title, so a mark meets the title's left end: at
     the large size the title starts 64 + 165 + 24 down (padding, picture, the room under it)
     and 16 in, as the design system's specs give them */
  .hug { position: relative; }
  .at-title { position: absolute; left: 16px; top: 253px; width: 1px; height: 28px; }
</style>
</head>
<body>

<!-- Figure 10.4 · zap on a computer -->
<figure class="shot" id="zap-computer">
  <div class="computer" data-view="zap">
    <div class="card-z">
      <div class="light"><div class="art a2"></div></div>
      <div class="veil"></div>
      <div class="clip" data-co="2"><div class="art a2"></div></div>
      <div style="position:absolute;left:300px;right:300px;top:2px;height:8px" data-co="1"></div>
      <div class="foot">
        <div class="info"><div class="in">
          <h2 class="ttl" data-co="3">Sintel</h2>
          <div class="ym"><span>2010</span><span class="r">★ 7.4</span></div>
          <p class="ov" data-co="4">A lonely young woman, Sintel, helps and befriends a dragon, whom she calls Scales. But when he is kidnapped by an adult dragon, Sintel sets out on a dangerous quest to find her lost friend.</p>
        </div></div>
        <div class="col2">
          <ds-iconbutton icon="bookmark" label="add to Watchlist" data-co="5" data-co-side="right"></ds-iconbutton>
          <ds-iconbutton icon="maximize" label="watch" data-co="6" data-co-side="right"></ds-iconbutton>
        </div>
      </div>
    </div>
  </div>
</figure>

    <div class="card-z">
      <div class="light"><div class="art steel"></div></div>
      <div class="veil"></div>
      <div style="position:absolute;left:40px;right:40px;top:120px;height:60px" data-co="1"></div>
      <div class="clip" data-co="2"><div class="art steel"></div></div>
      <div class="foot">
        <div class="info" data-co="3"><div class="in">
          <h2 class="ttl">Tears of Steel</h2>
          <div class="ym"><span>2012</span><span class="r">★ 6.6</span></div>
          <p class="ov">In a future Amsterdam, a group of scientists tries to save the world from robots by staging one moment from the past again.</p>
        </div></div>
        <div class="col2" data-co="4" data-co-side="right">
          <ds-iconbutton size="lg" icon="bookmark" label="add to Watchlist"></ds-iconbutton>
          <ds-iconbutton size="lg" icon="maximize" label="watch"></ds-iconbutton>
        </div>
      </div>

</figure>

<!-- Figure 10.6 · zap on a phone held sideways: the card of figure 10.5 turned -->
<figure class="shot" id="zap-sideways-phone">
  <div class="phone side" data-bar="none" data-tabs="none" data-view="none">
    <div class="card-z">
      <div class="light"><div class="art steel"></div></div>
      <div class="veil"></div>
      <div class="clip" data-co="1"><div class="art steel"></div></div>
      <div class="foot">
        <div class="info" data-co="2"><div class="in">
          <h2 class="ttl one">Tears of Steel</h2>
          <div class="ym"><span>2012</span><span class="r">★ 6.6</span></div>
        </div></div>
        <div class="col2" data-co="3" data-co-side="right">
          <ds-iconbutton size="lg" icon="bookmark" label="add to Watchlist"></ds-iconbutton>
          <ds-iconbutton size="lg" icon="maximize" label="watch"></ds-iconbutton>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 10.7 · zap on a TV: the scene alone -->
<figure class="shot" id="zap-tv">
  <div class="tv full" data-rail="none" data-view="none">
    <div class="scene"><div class="art a4"></div></div>
  </div>
</figure>

<!-- Figure 10.8 · the TV's info -->
<figure class="shot" id="zap-info-tv">
  <div class="tv full" data-rail="none" data-view="none">
    <div class="scene"><div class="art a4"></div></div>
    <div class="band"><div style="position:absolute;right:0;top:0;width:40px;height:20px" data-co="5" data-co-side="right"></div>
    <div class="zinfo">
      <div class="row" style="gap:16px">
        <h1 class="t" data-co="1">Cosmos Laundromat</h1>
        <span class="chip" data-co="2" data-co-side="right"><i data-i="bookmark"></i>add to Watchlist</span>
      </div>
      <div class="ym"><span>2015</span><span class="r">★ 7.0</span></div>

      <div class="keys" data-co="4">
        <span><ds-kbd>OK</ds-kbd>watch from here</span>
        <span><ds-kbd>down</ds-kbd><i class="or">or</i><ds-kbd>CH+</ds-kbd>next</span>
        <span><ds-kbd>CH−</ds-kbd>previous</span>
        <span><ds-kbd>up</ds-kbd>info</span>
        <span><ds-kbd>left</ds-kbd>mute</span>
        <span><ds-kbd>right</ds-kbd>Watchlist</span>
      </div>
    </div></div>
  </div>
</figure>

    <div class="page">
      <div class="state">
        <ds-empty illustration="empty" size="lg" title="nothing to zap yet" description="Zap plays the movies and shows you haven't watched yet."></ds-empty>
      </div>
    </div>
  </div>
</figure>

<script src="ds.js"></script>
<script src="frame.js"></script>
</body>
</html>
