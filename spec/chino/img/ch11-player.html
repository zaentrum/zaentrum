<!doctype html>
<!--
  Chapter 11, the player: the figures of spec/chino/playback.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame is frame.js (the player has no top bar,
  no tabs and no rail), the icons are icons.js. Pink numbers mark the parts
  the chapter's text explains. The settings menu is figure 11.9 here; the
  audio and subtitles panel is drawn in ch12-subtitles.html. Figures 11.1 to
  11.3 are screenshots of the deployed web player, not drawings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 11 the player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a phone held upright: the title under back, home and cast, on up to two
     lines; the buttons on two rows */
  .up .top { flex-wrap: wrap; row-gap: 10px; }
  .up .top .sp { flex: 1; }
  .up .top .name { flex: 0 0 100%; margin: 0; white-space: normal; line-height: 1.35;
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .up .bottom { gap: 8px; }
  .up .bottom .seek { margin-bottom: 4px; }

  /* the player: the picture fitted in the middle, the controls over it */
  .pl { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .pl .pic { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .phone.side .pl .pic { left: 50%; right: auto; top: 0; bottom: 0; height: 100%; transform: translateX(-50%); }
  .tv .pl .pic { inset: 0; transform: none; aspect-ratio: auto; }
  .pl .credits .art::after { display: none; }
  .pl .credits { filter: brightness(.55); }

  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 16px 16px 40px;
         background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 100%); }
  .top .name { flex: 1; min-width: 0; margin-left: 8px; font: 500 16px/1.2 var(--ff-mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 40px 16px 16px;
            background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 100%); }
  .seek { display: flex; align-items: center; gap: 12px; font: 500 13px/1 var(--ff-mono); color: var(--fg-2); }
  .seek .t1 { width: 52px; text-align: right; } .seek .t2 { width: 52px; }
  .track { position: relative; flex: 1; height: 6px; background: rgba(255,255,255,.15); }
  .track > i { position: absolute; top: 0; bottom: 0; }
  .track .buf { left: 0; background: rgba(255,255,255,.3); }
  .track .played { left: 0; background: var(--cloud-blue); }
  .track .seg.past { background: #A9CDFF; }      /* a marked part already played: a lighter blue */
  .track .seg.ahead { background: #8E96A4; }     /* a marked part ahead: a lighter grey */
  .track .head { top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); background: var(--fg); }
  .btns { display: flex; align-items: center; gap: 8px; }
  .btns .sp { flex: 1; }
  .vol { width: 96px; height: 4px; background: var(--border-2); position: relative; margin: 0 6px; flex: none; }
  .vol > i { position: absolute; left: 0; top: 0; bottom: 0; width: 80%; background: var(--cloud-blue); }

  /* the TV: the controls inside the safe area; the bottom band solid, out to the edges */
  /* inside the safe area with room for a focused control's ring (8 dp) */
  .tv .top { padding: 35px 56px 48px; gap: 12px; }
  .tv .top .name { font-size: 17px; margin-left: 4px; }
  .tv .bottom { padding: 16px 56px 35px; background: var(--bg); gap: 14px; }
  .tv .btns { gap: 12px; }
  .tv .vol { width: 72px; }
  .tv .seek { font-size: 12px; }

  /* the settings menu: above the whole bar at its button's end; the picked row
     with a check and the brighter text, as in the audio and subtitles panel */
  .smenu { position: absolute; right: 16px; width: 304px; background: var(--surface); border: 1px solid var(--border-2); padding: 4px 0; z-index: 6; }
  .smenu .hd { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); padding: 12px 16px 8px; }
  .smenu .it { height: 44px; display: flex; align-items: center; padding: 0 16px 0 12px; font: 400 14px/1 var(--ff-ui); color: var(--fg-muted); }
  .smenu .it .ck { width: 26px; flex: none; display: inline-flex; align-items: center; color: var(--cloud-blue); }
  .smenu .it.on { color: var(--fg); font-weight: 600; }
  .smenu .it .tail { font-weight: 400; color: var(--fg-2); white-space: pre; }
  .smenu .timing { border-top: 1px solid var(--border); margin-top: 4px; padding-bottom: 12px; }
  .smenu .timing .row { gap: 8px; padding: 0 16px; }
  .smenu .timing .v { flex: 1; text-align: center; font: 500 14px/1 var(--ff-mono); color: var(--fg); }
  .smenu .timing .b { height: 40px; padding: 0 12px; font-size: 13px; }
  .smenu .timing .b.icon { width: 40px; padding: 0; }
  .sub { position: absolute; text-align: center; color: #fff; z-index: 2; font-family: var(--ff-ui); font-weight: 500; line-height: 1.25;
         text-shadow: -1.5px -1.5px 0 #000, 0 -1.5px 0 #000, 1.5px -1.5px 0 #000, 1.5px 0 0 #000, 1.5px 1.5px 0 #000, 0 1.5px 0 #000, -1.5px 1.5px 0 #000, -1.5px 0 0 #000; }
  .sub > span { display: inline-block; }
  /* a mark's target under a button, so its line runs under the row, not across it */
  .under { position: absolute; left: 0; right: 0; top: 100%; margin-top: 5px; height: 4px; }

  /* the states */
  .wait { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px;
          padding: 18px 22px; background: var(--surface); border: 1px solid var(--border-2); }
  .loader { width: 36px; height: 36px; border: 3px solid var(--cloud-blue); border-top-color: var(--border-2); }
  .wait .line { font: 400 14px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; }
  .notice { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); padding: 10px 16px; white-space: nowrap;
            background: var(--surface); border: 1px solid var(--border-2); font: 400 14px/1.3 var(--ff-ui); color: var(--fg); }
  .nextcard { position: absolute; right: 24px; bottom: 112px; width: 340px; padding: 16px; display: flex; flex-direction: column; gap: 6px;
              background: var(--surface); border: 1px solid var(--border-2); }
  .nextcard .hd { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); }
  .nextcard .ep { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); }
  .nextcard .row { margin-top: 8px; }
  .details { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); margin-top: 4px; }
  /* on a TV the details show without being opened (chapter 17) */
  .tvdetails { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; font: 500 12px/1.4 var(--ff-mono); color: var(--fg-dim); }
  .tvdetails .hd { color: var(--fg-muted); }
</style>
</head>
