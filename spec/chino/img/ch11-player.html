<!doctype html>
<!--
  Chapter 11, the player: the figures of spec/chino/playback.md.
  Each figure of class "shot" becomes spec/chino/img/ID.png, ID being its id:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet; ds.js turns the
  <ds-*> tags into the design system's components (its icon buttons, buttons,
  loader, toast and empty state); frame.js draws the frame (the player has no
  top bar, no tabs and no rail). What stays chino's own is drawn here on the
  design system's tokens: the player, its top and bar, the seek bar, the volume,
  the up next card, the settings menu (the design system has no menu of one
  choice; it follows the action menu's look) and the details on a TV. Pink
  numbers mark the parts the chapter's text explains. The audio and subtitles
  panel is drawn in ch12-subtitles.html. Figures 11.1 to 11.3 are screenshots
  of the deployed web player, not drawings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 11 the player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the player: the picture fitted in the middle, the controls over it */
  .pl { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .pl .pic { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; overflow: hidden; }
  .phone.side .pl .pic { left: 50%; right: auto; top: 0; bottom: 0; height: 100%; transform: translateX(-50%); }
  .tv .pl .pic { inset: 0; transform: none; aspect-ratio: auto; }
  .pl .credits .art::after { display: none; }
  .pl .credits { filter: brightness(.55); }

  /* the top and the bar: the design system's icon buttons (34 px on a computer,
     42 dp on a phone and a TV) on a picture that darkens towards the edge */
  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 16px 16px 40px;
         background: linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,0) 100%); }
  .top .name { flex: 1; min-width: 0; margin-left: 8px; font: 500 16px/1.2 var(--ff-mono); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 12px; padding: 40px 16px 16px;
            background: linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 100%); }
  .btns, .grp { display: flex; align-items: center; gap: 8px; }
  .btns .sp, .top .sp { flex: 1; }

  /* the seek bar and the volume: chino's own, on the design system's tokens */
  .seek { display: flex; align-items: center; gap: 12px; font: 500 13px/1 var(--ff-mono); color: var(--fg-2); }
  .seek .t1 { width: 52px; text-align: right; } .seek .t2 { width: 52px; }
  .track { position: relative; flex: 1; height: 6px; background: rgba(255,255,255,.15); }
  .track > i { position: absolute; top: 0; bottom: 0; }
  .track .buf { left: 0; background: rgba(255,255,255,.3); }
  .track .played { left: 0; background: var(--cloud-blue); }
  .track .seg.past { background: #A9CDFF; }      /* a marked part already played: a lighter blue */
  .track .seg.ahead { background: #8E96A4; }     /* a marked part ahead: a lighter grey */
  .track .head { top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); background: var(--fg); }
  .vol { width: 96px; height: 4px; background: var(--border-2); position: relative; margin: 0 6px; flex: none; }
  .vol > i { position: absolute; left: 0; top: 0; bottom: 0; width: 80%; background: var(--cloud-blue); }

  /* a phone: 42 dp buttons 6 dp apart, so each keeps a touch area of 48 dp */
  .phone .top, .phone .btns, .phone .grp { gap: 6px; }
  .phone .top { padding: 12px 12px 36px; }
  .phone .bottom { padding: 36px 12px 12px; gap: 10px; }
  /* held upright: the title under back, home and cast, on up to two lines; the buttons on two rows */
  .up .top { flex-wrap: wrap; row-gap: 10px; }
  .up .top .name { flex: 0 0 100%; margin: 0 0 0 4px; white-space: normal; line-height: 1.35;
                   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* the TV: the controls inside the safe area, with room for the focus ring (8 dp);
     the bottom band solid, out to the edges */
  .tv .top { padding: 35px 56px 48px; gap: 12px; }
  .tv .top .name { font-size: 17px; margin-left: 4px; }
  .tv .bottom { padding: 16px 56px 35px; background: var(--bg); gap: 14px; }
  .tv .btns, .tv .grp { gap: 12px; }
  .tv .vol { width: 72px; }
  .tv .seek { font-size: 12px; }

  /* the settings menu: chino's own, with the look of the design system's action
     menu (its surface, frame and shadow, rows of 32 px in its monospace face);
     what the action menu has no part for: a header for each group, the picked
     row's check and brighter text, and the timing's controls */
  .pmenu { position: absolute; right: 16px; width: 264px; padding: 4px 0; background: var(--surface); border: 1px solid var(--border-2);
           box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 6; }
  .pmenu .hd { padding: 8px 12px 4px; font: 500 12px/1.3 var(--ff-mono); color: var(--fg-muted); }
  .pmenu .it { min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 4px 12px; font: 500 13px/1.3 var(--ff-mono);
               color: var(--fg-2); text-transform: lowercase; white-space: nowrap; }
  .pmenu .it .ck { width: 16px; height: 16px; flex: none; display: inline-flex; color: var(--cloud-blue); }
  .pmenu .it.on { color: var(--fg); font-weight: 600; }
  .pmenu .it .tail { font-weight: 500; color: var(--fg-muted); white-space: pre; }
  .pmenu .timing { border-top: 1px solid var(--border); margin-top: 4px; padding-bottom: 8px; }
  .pmenu .timing .grp { padding: 4px 12px 0; }
  .pmenu .timing .v { flex: 1; text-align: center; font: 500 13px/1 var(--ff-mono); color: var(--fg); }

  /* a subtitle: white, a black outline, no box; 5.33 % of the picture's height */
  .sub { position: absolute; text-align: center; color: #fff; z-index: 2; font-family: var(--ff-ui); font-weight: 500; line-height: 1.25;
         text-shadow: -1.5px -1.5px 0 #000, 0 -1.5px 0 #000, 1.5px -1.5px 0 #000, 1.5px 0 0 #000, 1.5px 1.5px 0 #000, 0 1.5px 0 #000, -1.5px 1.5px 0 #000, -1.5px 0 0 #000; }
  .sub > span { display: inline-block; }
  /* a mark's target under a button, so its line runs under the row, not across it */
  .under { position: absolute; left: 0; right: 0; top: 100%; margin-top: 5px; height: 4px; }

  /* up next: chino's own card on the controls' solid surface, the design system's buttons in it */
  .nextcard { position: absolute; right: 24px; bottom: 104px; width: 340px; padding: 16px; display: flex; flex-direction: column; gap: 6px;
              background: var(--surface); border: 1px solid var(--border-2); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .nextcard .hd { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); }
  .nextcard .ep { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); }
  .nextcard .grp { margin-top: 8px; }

  /* waiting: the design system's loader, large, in the middle on a solid surface, one line under it */
  .wait { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px;
          padding: 20px 24px; background: var(--surface); border: 1px solid var(--border-2); }
  .wait .line { font: 400 14px/1.4 var(--ff-ui); color: var(--fg-muted); white-space: nowrap; }

  /* couldn't play, on a TV: the design system's empty state, then the details shown
     without being opened (the look of a banner's details) and report a bug */
  .fail { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .fail .nc-illu { padding: 0 16px 0; }
  .fail .nc-illu__actions { gap: 12px; }
  .det { margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .det .tg { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); }
  .det .tx { padding: 6px 12px; border-left: 1px solid var(--border-2); font: 500 12px/1.55 var(--ff-mono); color: var(--fg-muted); }
  .fail > .nc-btn { margin-top: 14px; }
</style>
</head>
