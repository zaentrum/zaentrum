<!doctype html>
<!--
  Chapter 7, people: the target's figures of spec/chino/person.md (its
  as-deployed figures are screenshots). Each <figure class="shot" id="…">
  becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the nalet design system's own stylesheet; the
  <ds-*> tags are the design system's components (ds.js), the frame (top bar,
  tabs, rail) is frame.js, the icons are icons.js. Pink numbers mark the parts
  the chapter's text explains. What stays chino's own: the photo, the name in a
  title's type, the labelled facts and the posters.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 7 people</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the person's photo, in a 2:3 frame like the posters */
  .portrait { flex: none; }
  /* labelled facts: the label in the body face, as a field's label */
  .facts { display: flex; gap: 48px; }
  .facts .k { font: 500 13px/1.3 var(--ff-ui); color: var(--fg-muted); }
  .facts .v { margin-top: 3px; font: 400 14px/1.45 var(--ff-ui); color: var(--fg); }
  .facts .v .muted { color: var(--fg-dim); }
  .bio { margin: 0; }
  .tcount { margin: 0; font: 500 13px/1.3 var(--ff-mono); color: var(--fg-muted); }
  .fit { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

  /* on a computer */
  .computer .hd { position: absolute; left: 48px; right: 48px; top: 88px; display: flex; gap: 32px; }
  .computer .hd .portrait { width: 192px; height: 288px; }
  .computer .about { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding-top: 4px; }
  .computer .about .bio { max-width: 760px; }
  .computer .lib { position: absolute; left: 48px; top: 420px; }
  .computer .lib .h2 { display: inline-block; margin-bottom: 14px; }

  /* on a phone */
  .phone .hd { position: absolute; left: 16px; right: 16px; top: 16px; display: flex; gap: 14px; align-items: center; }
  .phone .hd .portrait { width: 96px; height: 144px; }
  .phone .t { font-size: 26px; }
  .phone .about { position: absolute; left: 16px; right: 16px; top: 176px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .phone .facts { gap: 28px; width: 100%; } .phone .facts > div { flex: none; } .phone .facts > div + div { flex: 1; min-width: 0; }
  .phone .bio .nc-text { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .phone .about .more { margin: -10px 0 0 -24px; }
  .phone .lib { position: absolute; left: 16px; right: 16px; top: 484px; }
  .phone .lib .h2 { display: inline-block; margin-bottom: 12px; }
  .phone .card.poster { width: 98px; } .phone .card.poster .img { height: 147px; }

  /* on a TV */
  .tv .hd { position: absolute; left: 0; right: 48px; top: 8px; display: flex; gap: 24px; }
  .tv .hd .portrait { width: 120px; height: 180px; }
  .tv .about { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-width: 0; }
  .tv .facts { gap: 40px; }
  .tv .bio { max-width: 600px; }
  .tv .bio .nc-text { font-size: 14px; }
  .tv .lib { position: absolute; left: 0; top: 260px; }
  .tv .lib .h2 { display: inline-block; margin-bottom: 12px; }
  .tv .card.poster { width: 96px; } .tv .card.poster .img { height: 144px; }

  /* a phone held sideways (780 × 360, the tabs a rail on the left): the
     computer's layout at the phone's size */
  .phone.side .hd { align-items: flex-start; gap: 16px; }
  .phone.side .about { position: static; flex: 1; min-width: 0; gap: 10px; }
  .phone.side .facts { gap: 40px; width: auto; }
  .phone.side .facts > div + div { flex: none; }
  .phone.side .bio .nc-text { font-size: 14px; line-height: 1.5; }
  .phone.side .lib { top: 262px; }
  .phone.side .lib .h2 { padding-right: 10px; }

  /* a page that couldn't load, or a removed person: the design system's empty
     state, centred in the page's place */
  .mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  /* on a TV the details stand under the button in the quiet text, without a
     disclosure that would take the focus from the way on (chapter 17) */
  .tvdet { width: 100%; margin: 6px 0 0; font: 400 12px/1.55 var(--ff-mono); color: var(--fg-muted); }
</style>
</head>
<body>

<!-- Figure 7.4 · a person's page on a computer -->
<figure class="shot" id="person-computer">
  <div class="computer" data-view="none">
    <div class="hd">
      <div class="portrait face" data-co="1"></div>
      <div class="about">
        <div class="fit" data-co="2" data-co-side="right">
          <h1 class="t">Derek de Lint</h1>
          <p class="tcount">1 title</p>
        </div>
        <div class="facts" data-co="3" data-co-side="right">
          <div><div class="k">Known for</div><div class="v">Acting</div></div>
          <div><div class="k">Born</div><div class="v">17 July 1950 <span class="muted">(age 76)</span><br>The Hague, Netherlands</div></div>
        </div>
        <p class="bio" data-co="4" data-co-side="right"><ds-text>Derek de Lint is a Dutch film and television actor, born in The Hague. He plays the grown-up Anton Steenwijk in The Assault, which won the Academy Award for Best Foreign Language Film, and Derek Rayne in the series Poltergeist: The Legacy. In the open movie Tears of Steel he plays Old Thom.</ds-text></p>
      </div>
    </div>
    <section class="lib">
      <h2 class="h2" data-co="5">in the library</h2>
      <div class="cards">
        <div class="card poster"><div class="img"><div class="art steel"></div></div><div class="tt">Tears of Steel</div><div class="st">2012 · actor</div></div>
      </div>
    </section>
  </div>
</figure>

<!-- Figure 7.5 · a person's page on a phone held upright -->
<figure class="shot" id="person-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="Derek de Lint" data-co-parts="back:1">
    <div class="hd">
      <div class="portrait face" data-co="2"></div>
      <div class="fit">
        <h1 class="t">Derek de Lint</h1>
        <p class="tcount">1 title</p>
      </div>
    </div>
    <div class="about">
      <div class="facts">
        <div><div class="k">Known for</div><div class="v">Acting</div></div>
        <div><div class="k">Born</div><div class="v">17 July 1950 <span class="muted">(age 76)</span><br>The Hague, Netherlands</div></div>
      </div>
      <p class="bio"><ds-text>Derek de Lint is a Dutch film and television actor, born in The Hague. He plays the grown-up Anton Steenwijk in The Assault, which won the Academy Award for Best Foreign Language Film, and Derek Rayne in the series Poltergeist: The Legacy. In the open movie Tears of Steel he plays Old Thom.</ds-text></p>
      <ds-button variant="ghost" size="lg" icon-end="chevron-down" class="more" data-co="3">read more</ds-button>

    <section class="lib">

        <div class="card poster"><div class="img"><div class="art steel"></div></div><div class="tt">Tears of Steel</div><div class="st">2012 · actor</div></div>
      </div>
    </section>
  </div>
</figure>

          <div><div class="k">Known for</div><div class="v">Acting</div></div>

        </div>
        <p class="bio" data-co="2" data-co-side="right"><ds-text>Derek de Lint is a Dutch film and television actor, born in The Hague. He plays the grown-up Anton Steenwijk in The Assault, which won the Academy Award for Best Foreign Language Film, and Derek Rayne in the series Poltergeist: The Legacy. In the open movie Tears of Steel he plays Old Thom.</ds-text></p>
      </div>
    </div>
    <section class="lib">
      <h2 class="h2" data-co="3" data-co-side="right">in the library</h2>
      <div class="cards" style="gap:16px">
        <div class="card poster"><div class="img"><div class="art steel"></div></div><div class="tt">Tears of Steel</div><div class="st">2012 · actor</div></div>
      </div>
    </section>
  </div>
</figure>

<!-- Figure 7.7 · a person's page on a TV -->
<figure class="shot" id="person-tv">
  <div class="tv" data-view="none">
    <div class="page">
      <div class="hd">
        <div class="portrait face" data-co="1" data-co-side="top"></div>
        <div class="about">
          <div class="fit">

          <p class="bio"><ds-text>Derek de Lint is a Dutch film and television actor, born in The Hague. He plays the grown-up Anton Steenwijk in The Assault, which won the Academy Award for Best Foreign Language Film, and Derek Rayne in the series Poltergeist: The Legacy. In the open movie Tears of Steel he plays Old Thom.</ds-text></p>

        </div>
      </section>
    </div>
  </div>
</figure>

      <div class="sk" style="width:330px;height:40px"></div>
      <div class="sk" style="width:70px;height:14px"></div>

    </div>

</figure>

<!-- Figure 7.9 · a person's page when it couldn't load, on a TV -->
<figure class="shot" id="person-couldnt-load-tv">
  <div class="tv" data-view="none">
    <div class="page" style="right:48px">
      <div class="mid">
        <ds-empty illustration="error" size="lg" title="couldn't load this person" description="The server ran into a problem." data-co-in=".nc-illu__title 1"><ds-button size="lg" class="focus" data-co="2">try again</ds-button><p class="tvdet">HTTP 500 Internal Server Error</p></ds-empty>
      </div>
    </div>
  </div>
</figure>

<figure class="shot" id="person-removed-phone">
  <div class="phone" data-view="none" data-bar="back" data-title="">

      <ds-empty illustration="empty" size="lg" title="this person isn't in the library anymore" data-co-in=".nc-illu__title 1"><ds-button size="lg" data-co="2">back</ds-button></ds-empty>
    </div>
  </div>
</figure>

<!-- Figure 7.11 · a person who was removed, on a phone held sideways -->
<figure class="shot" id="person-removed-side-phone">
  <div class="phone side" data-view="none" data-bar="back" data-title="">
    <div class="mid">
      <ds-empty illustration="empty" size="sm" title="this person isn't in the library anymore"><ds-button size="lg">back</ds-button></ds-empty>
    </div>
  </div>
</figure>

<script src="ds.js"></script>
<script src="frame.js"></script>
</body>
</html>
