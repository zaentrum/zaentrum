<!doctype html>
<!--
  Chapter 14, casting: the figures of spec/chino/casting.md. Every phone screen
  is drawn held upright (<div class="phone">, 360 × 780) and sideways
  (<div class="phone side">, 780 × 360, the tabs as a rail on the left).
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet, the frame
  (tabs) is frame.js, the icons are icons.js. A title's page follows chapter
  6's drawings (ch06-title.html); its bar is drawn here, because it holds the
  cast button. Google's widgets (the button, the bar, the full controls) are
  drawn in chino's colours, as the chapter specifies; their layouts are
  Google's and haven't been checked on a real Cast device yet. What chino draws
  itself is the design system's: the buttons of the title row (<ds-*> tags,
  ds.js) and the error banner when the TV can't play a title.
  Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 14 casting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a title's page's bar: the back arrow, the title's name, the cast button in a 48 dp square */
  .xbar { position: absolute; left: 0; right: 0; top: 0; height: 56px; z-index: 10; display: flex; align-items: center; gap: 10px;
          padding: 0 4px 0 6px; background: var(--bg-2); border-bottom: 1px solid var(--border); }
  .side .xbar { height: 48px; }
  .xbar .title { font: 600 16px/1 var(--ff-mono); margin-right: auto; white-space: nowrap; }
  .xbar .icon-b { color: var(--fg); }
  .xbar .icon-b.cast { width: 48px; height: 48px; }
  .under { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; overflow: hidden; }
  .side .under { top: 48px; }

  /* the title row's parts, as chapter 6 draws them: add to list is chino's own,
     two parts in one frame, at the design system's large height */
  .split { display: inline-flex; flex: none; height: 42px; border: 1px solid var(--border-2); background: var(--surface); color: var(--fg); }
  .split > span { display: inline-flex; align-items: center; justify-content: center; }
  .split .m { width: 40px; }
  .split .c { width: 34px; border-left: 1px solid var(--border-2); }
  /* the download control (chapter 13): the button, and the size after it */
  .dlc { display: inline-flex; align-items: center; gap: 8px; flex: none; }
  .size { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); white-space: nowrap; }

  /* a title's page on a phone (chapter 6) */
  .bd { position: absolute; left: 0; right: 0; top: 0; height: 200px; overflow: hidden; }
  .bd .fade { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,.6) 30%, rgba(11,15,25,0) 60%); }
  .pos { position: relative; flex: none; overflow: hidden; }
  .hd { position: absolute; left: 16px; right: 16px; top: 140px; display: flex; gap: 14px; align-items: flex-start; }
  .hd .pos { width: 96px; height: 144px; }
  .hd .nm { padding-top: 68px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .phone .t { font-size: 22px; }
  .phone .meta { font-size: 12px; }
  .body { position: absolute; left: 16px; right: 16px; top: 300px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* held sideways: the poster at the left, the name, the row and the words beside it */
  .side .bd { height: 140px; }
  .side .hd2 { position: absolute; left: 24px; right: 24px; top: 22px; display: flex; gap: 24px; align-items: flex-start; }
  .side .hd2 .pos { width: 120px; height: 180px; box-shadow: 0 0 0 1px var(--border-2); }
  .side .hd2 .info { padding-top: 30px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
  .side .hd2 .info .acts { margin-top: 8px; width: fit-content; }
  .side .hd2 .info .desc { margin-top: 4px; font-size: 14px; max-width: 460px; }

  /* home on a phone, as chapter 4 draws it, under the bar */
  .shelf { padding: 16px 0 0 16px; }
  .shelf .h2 { margin-bottom: 12px; }
  .phone .card { width: 200px; } .phone .card .img { height: 112px; }
  .phone .card.poster { width: 104px; } .phone .card.poster .img { height: 156px; }
  .side .shelf { padding: 16px 0 0 24px; }
  .side .card { width: 176px; } .side .card .img { height: 99px; }

  /* the bar while casting: Google's mini controller on the surface, the poster 43 × 64 */
  .castbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; height: 64px; display: flex; align-items: center; gap: 12px;
             padding-right: 8px; background: var(--surface); border-top: 1px solid var(--border); }
  .castbar .pst { position: relative; width: 43px; height: 64px; flex: none; overflow: hidden; }
  .castbar .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .castbar .tx .nm { font: 500 13px/1.3 var(--ff-ui); color: var(--fg); }
  .castbar .tx .dev { font: 400 12px/1.3 var(--ff-ui); color: var(--fg-muted); }
  .castbar .icon-b { width: 48px; height: 48px; color: var(--fg); }

  /* the full controls: Google's expanded controller in chino's colours, on the background colour */
  .fc { position: absolute; inset: 0; background: var(--bg); }
  .fc .tool { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
  .fc .tool .icon-b { color: var(--fg); }
  .fc .poster { position: absolute; left: 70px; top: 104px; width: 220px; height: 330px; overflow: hidden; }
  .fc .tx { position: absolute; left: 24px; right: 24px; top: 462px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .fc .tx .nm { font: 600 20px/1.25 var(--ff-ui); color: var(--fg); }
  .fc .tx .dev { font: 400 14px/1.3 var(--ff-ui); color: var(--fg-muted); }
  .fc .seek { position: absolute; left: 24px; right: 24px; top: 548px; display: flex; align-items: center; gap: 12px; font: 400 12px/1 var(--ff-ui); color: var(--fg-2); }
  .fc .seek .bar { flex: 1; }
  .fc .seek .bar .knob { position: absolute; left: 32%; top: -5px; width: 14px; height: 14px; margin-left: -7px; background: var(--cloud-blue); }
  .fc .ctl { position: absolute; left: 0; right: 0; top: 604px; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .fc .ctl .icon-b { width: 48px; height: 48px; color: var(--fg); }
  .fc .ctl .pp { width: 64px; height: 64px; background: var(--cloud-blue); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; }
  .skip { position: relative; }
  .skip b { position: absolute; left: 0; right: 0; top: 50%; margin-top: -4px; text-align: center; font: 700 8px/8px var(--ff-mono); }
  /* held sideways: the artwork at the left, the title, the device, the seek bar and the buttons beside it */
  .side .fc .tool { height: 48px; }
  .side .fc .poster { left: 40px; top: 56px; width: 160px; height: 240px; }
  .side .fc .right { position: absolute; left: 240px; right: 40px; top: 72px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .side .fc .right .tx { position: static; align-items: center; }
  .side .fc .right .seek { position: static; width: 100%; }
  .side .fc .right .ctl { position: static; width: fit-content; }

  /* the bar's place, above the tabs, holding the design system's error banner when the TV can't play a title */
  .castwarn { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); }
  .side .castwarn { padding: 10px 24px; }
</style>
</head>
<body>

<!-- Figure 14.1 · the cast button on a title's page, on a phone held upright -->
<figure class="shot" id="casting-button-phone">

    <header class="xbar">
      <span class="icon-b"><i data-i="arrow-left"></i></span>
      <span class="title">Sprite Fright</span>
      <span class="icon-b cast" data-co="1" data-co-side="right"><i data-i="cast"></i></span>
    </header>
    <div class="under">

      <div class="hd">
        <div class="pos"><div class="art a4"></div></div>
        <div class="nm">

          <p class="meta"><ds-badge>movie</ds-badge></p>
        </div>
      </div>
      <div class="body">
        <div class="acts">
          <ds-button size="lg" variant="primary" icon="play" data-co="2">play</ds-button>

        </div>
        <p class="desc">Teenagers on a trip into the woods meet the small folk who live there, and the small folk don't want them.</p>
      </div>
    </div>
  </div>
</figure>
