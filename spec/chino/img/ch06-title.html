<!doctype html>
<!--
  Chapter 6, the title page: the target's figures of spec/chino/title-actions.md
  (its as-deployed figures are screenshots). Each <figure class="shot" id="…">
  becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the nalet design system's own stylesheet; the
  <ds-*> tags are the design system's components (ds.js), the frame (top bar,
  tabs, rail) is frame.js, the icons are icons.js. Pink numbers mark the parts
  the chapter's text explains; pink words over a row name the state it shows.
  What stays chino's own: the still, the poster, the title row's layout, the
  episode rows and their season, the cards and their status marks, and the on
  look of a toggle (the design system's icon button has no on state).
  The title row's own figures (title-row, title-row-series, add-to-list,
  cards-and-episodes) moved here from mockups.html, under the same ids.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 6 the title page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the title row (section 6.5): chino's own layout of the design system's
     buttons, icon buttons and multi select; a control wraps as a whole */
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tv .acts { gap: 12px; }
  /* a toggle that is on: the design system's icon button has no on state, so
     chino fills it with its meaning's colour, the icon dark (section 6.5.3) */
  .nc-iconbtn.on-wl { background: var(--cloud-blue); border-color: var(--cloud-blue); color: var(--bg); }
  .nc-iconbtn.on-seen { background: var(--signal-green); border-color: var(--signal-green); color: var(--bg); }
  .nc-iconbtn.on-liked { background: var(--signal-red); border-color: var(--signal-red); color: var(--bg); }
  .nc-iconbtn.on-wl svg, .nc-iconbtn.on-liked svg { fill: currentColor; }
  /* the download control of chapter 13 in a row: its status, then its button */
  .dlc { display: inline-flex; align-items: center; gap: 8px; flex: none; }
  .meta .nc-badge { margin-left: 8px; vertical-align: 1px; }
  .meta svg.i { vertical-align: -2px; color: var(--fg-muted); }

  /* the page's still, fading into the page's colour before any words */
  .bd { position: absolute; left: 0; right: 0; overflow: hidden; }
  .bd .fade { position: absolute; inset: 0; }
  .pos { position: relative; flex: none; overflow: hidden; }

  /* labelled facts: the label in the body face, as a field's label */
  .facts { display: flex; gap: 48px; }
  .facts .k { font: 500 13px/1.3 var(--ff-ui); color: var(--fg-muted); }
  .facts .v { margin-top: 3px; font: 400 14px/1.45 var(--ff-ui); color: var(--fg); }
  .cast { display: flex; gap: 36px; }
  .cast .n { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; }
  .cast .ch { margin-top: 2px; font: 400 13px/1.3 var(--ff-ui); color: var(--fg-dim); white-space: nowrap; }
  .desc-w { margin: 0; }
  .fit { display: flex; flex-direction: column; align-items: flex-start; }

  /* a movie's page on a computer. What is placed against the frame, frame.js moves 80 px right with
     the page, beside the rail: a right edge at the page's edge is 80 from the frame's, one 48 in from
     it is 128 */
  .computer .bd { top: 56px; right: 80px; height: 320px; }
  .computer .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, var(--bg) 24%, rgba(11,15,25,.6) 50%, rgba(11,15,25,0) 64%); }
  .computer .head { position: absolute; left: 48px; right: 128px; top: 200px; display: flex; gap: 32px; }
  .computer .head .pos { width: 200px; height: 300px; }
  .computer .info { padding-top: 100px; display: flex; flex-direction: column; align-items: flex-start; }
  .computer .info .meta { margin-top: 10px; }
  .computer .info .acts { margin-top: 18px; }
  .computer .info .desc-w { margin-top: 16px; max-width: 720px; }
  .computer .ppl { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .computer .ppl .facts { margin-top: 8px; }
  .computer .more { position: absolute; left: 48px; top: 676px; }
  .computer .more .h2 { margin-bottom: 12px; }

  /* a movie's page on a phone */
  .phone .bd { top: 0; height: 150px; }
  .phone .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,.6) 30%, rgba(11,15,25,0) 60%); }
  .phone .hd { position: absolute; left: 16px; right: 16px; top: 86px; display: flex; gap: 14px; align-items: flex-start; }
  .phone .hd .pos { width: 96px; height: 144px; }
  .phone .hd .nm { padding-top: 66px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .phone .t { font-size: 26px; }
  .phone .hd .nm .t { margin-bottom: 4px; }
  .phone .meta { font-size: 12px; }
  .phone .body { position: absolute; left: 16px; right: 16px; top: 306px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .phone .cast2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; width: 100%; }
  .phone .cast2 .n { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); }
  .phone .cast2 .ch { margin-top: 2px; font: 400 13px/1.3 var(--ff-ui); color: var(--fg-dim); }

  /* a movie's page on a TV, as it opens */
  .tv .bd { top: 0; height: 236px; }
  .tv .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, var(--bg) 20%, rgba(11,15,25,.55) 50%, rgba(11,15,25,0) 72%),
                              linear-gradient(90deg, rgba(11,15,25,.85) 0%, rgba(11,15,25,0) 22%); }
  .tv .head { position: absolute; left: 0; right: 48px; top: 86px; display: flex; gap: 24px; }
  .tv .head .pos { width: 120px; height: 180px; }
  .tv .info { padding-top: 96px; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .tv .info .meta { margin-top: 8px; }
  .tv .info .acts { margin-top: 16px; }
  .tv .info .desc-w { margin-top: 14px; max-width: 600px; }
  .tv .tvp { position: absolute; left: 0; top: 428px; }
  .tv .tvp .h2 { display: inline-block; margin-bottom: 10px; }
  .pcs { display: flex; gap: 12px; }
  .pc { width: 112px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pc .ph { width: 72px; height: 72px; flex: none; }

  /* a show's episodes: one box per season, its header on the surface, its rows on the page */
  .season { border: 1px solid var(--border-2); }
  .season .sh { display: flex; align-items: center; gap: 14px; background: var(--surface); }
  .season .sh .sn { font: 600 15px/1.2 var(--ff-mono); color: var(--fg); }
  .season .sh .cnt { font: 500 13px/1 var(--ff-mono); color: var(--fg-dim); }
  .season .sh .chev { margin-left: auto; color: var(--fg-muted); }
  .ep { border-top: 1px solid var(--border); }
  .ep .top { display: flex; gap: 16px; }
  .ep .still { position: relative; flex: none; overflow: hidden; }
  .ep .still .bar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(42,49,66,.9); }
  .ep .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ep .l1 { display: flex; align-items: baseline; gap: 12px; }
  .ep .nm { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); }
  .ep.seen .nm { color: var(--fg-muted); }
  .ep .len { margin-left: auto; flex: none; font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); }
  .ep .left { font: 500 12px/1.3 var(--ff-mono); color: var(--cloud-blue); }
  .ep .ds { margin: 0; font: 400 13px/1.45 var(--ff-ui); color: var(--fg-2); }
  .ep .acts { margin-top: 10px; width: fit-content; }

  .computer .eps { position: absolute; left: 48px; right: 128px; top: 88px; }
  .computer .eps > .h2 { margin-bottom: 14px; }
  .computer .season .sh { height: 56px; padding: 0 16px 0 20px; }
  .computer .ep { padding: 14px 20px; }
  .computer .ep .still { width: 160px; height: 90px; }

  .phone .eps { position: absolute; left: 0; right: 0; top: 16px; }
  .phone .eps > .h2 { margin: 0 16px 12px; }
  .phone .season { border-left: 0; border-right: 0; }
  .phone .season .sh { height: 52px; padding: 0 14px 0 16px; }
  .phone .season .offer { padding: 0 16px 12px; background: var(--surface); }
  .phone .ep { padding: 12px 16px; }
  .phone .ep .top { gap: 12px; }
  .phone .ep .still { width: 128px; height: 72px; }
  .phone .ep .l1 { gap: 8px; }
  .phone .ep .code { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-muted); }
  .phone .ep .nm { font-size: 14px; }
  .phone .ep .ds { font-size: 12px; line-height: 1.4; }

  .tv .eps { position: absolute; left: 0; top: 0; width: 764px; }
  .tv .eps > .h2 { margin: 4px 0 10px; }
  .tv .season { border-bottom: 0; }
  .tv .season .sh { height: 44px; padding: 0 14px 0 16px; }
  .tv .ep { display: flex; align-items: center; gap: 16px; padding: 10px 14px 10px 16px; }
  .tv .ep .top { flex: 1; min-width: 0; }
  .tv .ep .still { width: 128px; height: 72px; }
  .tv .ep .nm { font-size: 14px; }
  .tv .ep .ds { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv .ep .side { display: flex; align-items: center; gap: 12px; flex: none; }

  /* a phone held sideways (780 × 360, the tabs a rail on the left): the
     computer's layout at the phone's size - the still a band at the top, the
     poster beside the name, the row under them */
  .phone.side .bd { top: 0; height: 120px; }
  .phone.side .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, var(--bg) 18%, rgba(11,15,25,.6) 50%, rgba(11,15,25,0) 80%); }
  .phone.side .hd { top: 24px; align-items: flex-end; gap: 16px; }
  .phone.side .hd .nm { padding: 0 0 4px; gap: 6px; }
  .phone.side .body { top: 182px; gap: 12px; }
  .phone.side .eps { top: 0; }
  .phone.side .season .sh { height: 48px; }
  .phone.side .season .offer { padding: 0 16px 10px; }
  .phone.side .ep .top { gap: 16px; }
  .phone.side .ep .txt { gap: 3px; }
  .phone.side .ep .l1 { padding-right: 12px; }
  .phone.side .ep .acts { margin-top: 8px; flex-wrap: nowrap; }

  /* the figures of the row and its parts: on the page's colour, without a
     frame; the pink words over each row name the state it shows */
  .sheet { background: var(--bg); border: 1px solid var(--border); padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 26px; }
  .sheet .cap { margin: 0 0 10px; font: 500 12px/1.4 var(--ff-mono); color: var(--mark); }
  .cols { display: flex; gap: 56px; align-items: flex-start; }

  /* cards: their status marks, and a card's menu: the design system's action
     menu, its button at the right of the card's lines, as in chapters 4 and 5 */
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  .card { position: relative; }
  .card:has(> .nc-actionmenu__trigger) .tt, .card:has(> .nc-actionmenu__trigger) .st { padding-right: 36px; }
  .card > .nc-actionmenu__trigger { position: absolute; right: -4px; bottom: 1px; }

  /* loading: grey blocks in the shape of what is coming */
  .skrow { display: flex; gap: 12px; align-items: center; }

  /* a page that couldn't load, or a removed title: the design system's empty state, centred in the page's place */
  .mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .computer .mid { right: 80px; }   /* moved 80 px right with the page: centred beside the rail */
</style>
</head>

<script src="ds.js"></script>
<script>
  // the design system's components first (frame.js would expand them too), so
  // this chapter can finish what the kit leaves open before the frame is drawn
  DS.expand(document.body);
  // a multi select's summary is blue only once something is chosen, as the package draws it
  for (const ms of document.querySelectorAll('.nc-multiselect')) {
    if (!ms.querySelector('.nc-checkbox__input[checked]')) ms.querySelector('.nc-multiselect__trigger').classList.remove('nc-multiselect__trigger--active');
  }
  // the list picker's way to a new list: the multi select has no place for it,
  // so it is a quiet button under the options (6.C10)
  for (const ms of document.querySelectorAll('.nc-multiselect[data-create]')) {
    const t = document.createElement('div');
    t.innerHTML = `<ds-button variant="ghost" size="sm" icon="plus" block style="justify-content:flex-start;margin-top:4px">${ms.dataset.create}</ds-button>`;
    DS.expand(t);
    ms.querySelector('.nc-multiselect__options').after(t.firstElementChild);
  }
  // an open card menu opens 4 px under its button, lined up with the button's
  // right edge, as the design system's action menu does
  document.fonts.ready.then(() => {
    for (const m of document.querySelectorAll('.cards > .nc-actionmenu')) {
      const box = m.parentElement, t = box.querySelector('.nc-actionmenu__trigger[aria-expanded="true"]');
      if (!t) continue;
      const b = box.getBoundingClientRect(), r = t.getBoundingClientRect();
      m.style.top = `${Math.round(r.bottom - b.top + 4)}px`;
      m.style.left = `${Math.round(r.right - b.left - m.offsetWidth)}px`;
    }
  });
</script>
<script src="frame.js"></script>
</body>
</html>
