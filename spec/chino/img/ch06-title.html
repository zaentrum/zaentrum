<!doctype html>
<!--
  Chapter 6, the title page: the figures of docs/chino/title-actions.md.
  Each <figure class="shot" id="…"> becomes docs/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
  The title row's own figures (title-row, title-row-series, add-to-list,
  cards-and-episodes) are drawn in mockups.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 6 the title page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* the title row's parts (section 6.4): add to list in two parts, the on looks */
  .split { display: inline-flex; flex: none; height: 48px; border: 1px solid var(--border-2); background: var(--surface); color: var(--fg); }
  .split > span { display: inline-flex; align-items: center; justify-content: center; }
  .split .m { width: 46px; }
  .split .c { width: 40px; border-left: 1px solid var(--border-2); }
  .split.on { background: var(--cloud-blue); border-color: var(--cloud-blue); color: var(--bg); }
  .split.on .c { border-left-color: rgba(11,15,25,.4); }
  .tv .split { height: 40px; } .tv .split .m { width: 38px; } .tv .split .c { width: 34px; }
  .b.green { background: var(--signal-green); border-color: var(--signal-green); color: var(--bg); }
  .b.st2 { color: var(--fg-2); }
  .b .bar { width: 100%; height: 3px; }
  .kind { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; margin-left: 8px; border: 1px solid var(--border-2);
          background: var(--surface-2); color: var(--fg-muted); font: 500 11px/1 var(--ff-mono); vertical-align: 1px; }
  .meta svg.i { vertical-align: -2px; color: var(--fg-muted); }

  /* the page's still, fading into the page's colour before any words */
  .bd { position: absolute; left: 0; right: 0; overflow: hidden; }
  .bd .fade { position: absolute; inset: 0; }
  .pos { position: relative; flex: none; overflow: hidden; }

  /* labelled facts: the label in the body face, as a field's label */
  .facts { display: flex; gap: 48px; }
  .facts .k { font: 500 13px/1.3 var(--ff-ui); color: var(--fg-muted); }
  .facts .v { margin-top: 3px; font: 400 14px/1.45 var(--ff-ui); color: var(--fg); }
  .cast { display: flex; gap: 36px; }
  .cast .n { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); white-space: nowrap; }
  .cast .ch { margin-top: 2px; font: 400 13px/1.3 var(--ff-ui); color: var(--fg-dim); white-space: nowrap; }

  /* a movie's page on a computer */
  .computer .bd { top: 56px; height: 320px; }
  .computer .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, var(--bg) 24%, rgba(11,15,25,.6) 50%, rgba(11,15,25,0) 64%); }
  .computer .head { position: absolute; left: 48px; right: 48px; top: 200px; display: flex; gap: 32px; }
  .computer .head .pos { width: 200px; height: 300px; }
  .computer .info { padding-top: 100px; display: flex; flex-direction: column; align-items: flex-start; }
  .computer .info .meta { margin-top: 10px; }
  .computer .info .acts { margin-top: 18px; }
  .computer .info .desc { margin-top: 18px; max-width: 720px; }
  .computer .ppl { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .computer .ppl .facts { margin-top: 10px; }
  .computer .more { position: absolute; left: 48px; top: 690px; }
  .computer .more .h2 { margin-bottom: 12px; }
  .fit { display: flex; flex-direction: column; align-items: flex-start; }

  /* a movie's page on a phone */
  .phone .bd { top: 0; height: 200px; }
  .phone .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, rgba(11,15,25,.6) 30%, rgba(11,15,25,0) 60%); }
  .phone .hd { position: absolute; left: 16px; right: 16px; top: 140px; display: flex; gap: 14px; align-items: flex-start; }
  .phone .hd .pos { width: 96px; height: 144px; }
  .phone .hd .nm { padding-top: 50px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .phone .t { font-size: 22px; }
  .phone .meta { font-size: 12px; }
  .phone .body { position: absolute; left: 16px; right: 16px; top: 306px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .phone .acts { flex-wrap: wrap; row-gap: 8px; }
  .phone .acts .b { padding: 0 14px; }
  .phone .acts .b.icon { padding: 0; }
  .phone .cast2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; width: 100%; }
  .phone .cast2 .n { font: 500 14px/1.3 var(--ff-ui); color: var(--fg); }
  .phone .cast2 .ch { margin-top: 2px; font: 400 13px/1.3 var(--ff-ui); color: var(--fg-dim); }

  /* a movie's page on a TV, as it opens */
  .tv .bd { top: 0; height: 250px; }
  .tv .bd .fade { background: linear-gradient(0deg, var(--bg) 0%, var(--bg) 20%, rgba(11,15,25,.55) 50%, rgba(11,15,25,0) 72%),
                              linear-gradient(90deg, rgba(11,15,25,.85) 0%, rgba(11,15,25,0) 22%); }
  .tv .head { position: absolute; left: 0; right: 48px; top: 103px; display: flex; gap: 24px; }
  .tv .head .pos { width: 120px; height: 180px; }
  .tv .info { padding-top: 92px; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .tv .info .meta { margin-top: 8px; }
  .tv .info .acts { margin-top: 14px; gap: 12px; }
  .tv .info .desc { margin-top: 14px; max-width: 600px; }
  .tv .tvp { position: absolute; left: 0; top: 444px; }
  .tv .tvp .h2 { display: inline-block; margin-bottom: 10px; }
  .pcs { display: flex; gap: 12px; }
  .pc { width: 112px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pc .ph { width: 72px; height: 72px; flex: none; }
  .pc .ini { width: 72px; height: 72px; flex: none; background: var(--surface-2); color: var(--fg-muted); font: 600 22px/72px var(--ff-mono); text-align: center; }

  /* a show's episodes: one box per season, its header on the surface, its rows on the page */
  .season { border: 1px solid var(--border-2); }
  .season .sh { display: flex; align-items: center; gap: 14px; background: var(--surface); }
  .season .sh .h2 { font-size: 15px; }
  .season .sh .cnt { font: 500 13px/1 var(--ff-mono); color: var(--fg-dim); }
  .season .sh .chev { margin-left: auto; color: var(--fg-muted); }
  .ep { border-top: 1px solid var(--border); }
  .ep .top { display: flex; gap: 16px; }
  .ep .still { position: relative; flex: none; overflow: hidden; }
  .ep .still .bar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(42,49,66,.9); }
  .ep .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ep .l1 { display: flex; align-items: baseline; gap: 12px; }
  .ep .nm { font: 500 15px/1.3 var(--ff-ui); color: var(--fg); }
  .ep.seen .nm { color: var(--fg-muted); }
  .ep .len { margin-left: auto; flex: none; font: 500 12px/1 var(--ff-mono); color: var(--fg-dim); }
  .ep .left { font: 500 12px/1.3 var(--ff-mono); color: var(--cloud-blue); }
  .ep .ds { margin: 0; font: 400 13px/1.45 var(--ff-ui); color: var(--fg-2); }
  .ep .acts { margin-top: 12px; width: fit-content; }

  .computer .eps { position: absolute; left: 48px; right: 48px; top: 88px; }
  .computer .eps > .h2 { margin-bottom: 14px; }
  .computer .season .sh { height: 56px; padding: 0 16px 0 20px; }
  .computer .ep { padding: 16px 20px; }
  .computer .ep .still { width: 160px; height: 90px; }
  .computer .ep .acts { margin-top: 10px; }

  .phone .eps { position: absolute; left: 0; right: 0; top: 16px; }
  .phone .eps > .h2 { margin: 0 16px 12px; }
  .phone .season { border-left: 0; border-right: 0; }
  .phone .season .sh { height: 52px; padding: 0 14px 0 16px; }
  .phone .season .offer { padding: 0 16px 12px; background: var(--surface); }
  .phone .season .offer .b { padding: 0 12px; }
  .phone .ep { padding: 12px 16px; }
  .phone .ep .top { gap: 12px; }
  .phone .ep .still { width: 128px; height: 72px; }
  .phone .ep .l1 { gap: 8px; }
  .phone .ep .code { font: 500 12px/1.3 var(--ff-mono); color: var(--fg-muted); }
  .phone .ep .nm { font-size: 14px; }
  .phone .ep .ds { font-size: 12px; line-height: 1.4; }
  .phone .ep .acts { margin-top: 10px; flex-wrap: wrap; row-gap: 8px; }
  .phone .ep .acts .b { padding: 0 14px; }
  .phone .ep .acts .b.icon { padding: 0; }
  .phone .ep .dl { flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; width: 222px; }

  .tv .eps { position: absolute; left: 0; top: 0; width: 764px; }
  .tv .eps > .h2 { margin: 4px 0 10px; }
  .tv .season { border-bottom: 0; }
  .tv .season .sh { height: 44px; padding: 0 14px 0 16px; }
  .tv .ep { display: flex; align-items: center; gap: 16px; padding: 10px 14px 10px 16px; }
  .tv .ep .top { flex: 1; min-width: 0; }
  .tv .ep .still { width: 128px; height: 72px; }
  .tv .ep .nm { font-size: 14px; }
  .tv .ep .ds { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv .ep .side { display: flex; gap: 12px; flex: none; }

  /* loading: grey blocks in the shape of what is coming */
  .skrow { display: flex; gap: 12px; }
</style>
</head>
