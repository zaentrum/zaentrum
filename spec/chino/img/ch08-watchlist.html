<!doctype html>
<!--
  Chapter 8, watchlist and lists: the figures of spec/chino/watchlist.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet, the design
  system's components are the <ds-*> tags (ds.js), the frame (top bar, tabs,
  rail) is frame.js, the icons are icons.js. Pink numbers mark the parts the
  chapter's text explains. chino's own: the rows of posters with their names,
  the see all card, the cards and their status marks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 8 watchlist and lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* artwork for the films home doesn't draw (as in chapter 5) */
  .x2 { background: linear-gradient(160deg, #557232 0%, #2e3d1a 58%, #151c0c 100%); }
  .x3 { background: linear-gradient(160deg, #723030 0%, #3e1a1a 58%, #1c0c0c 100%); }
  .x5 { background: linear-gradient(160deg, #7a4a5f 0%, #432836 58%, #1f1219 100%); }
  /* the view's heading, with create list at the end of its line */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  /* a list's row: its name and count, its newest titles, and see all at its end */
  .shelf { margin-bottom: 28px; }
  .shelf .h2 { margin-bottom: 12px; }
  .h2 .n { color: var(--fg-dim); font-weight: 500; }
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  .seeall { flex: none; width: 150px; height: 225px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            background: var(--surface); border: 1px solid var(--border); color: var(--cloud-blue); font: 600 14px/1 var(--ff-mono); }
  /* a card's menu: the design system's action menu, its button at the right of the card's lines, under the poster */
  .card { position: relative; }
  .card:has(> .nc-actionmenu__trigger) .tt, .card:has(> .nc-actionmenu__trigger) .st { padding-right: 36px; }
  .card > .nc-actionmenu__trigger { position: absolute; right: -4px; bottom: 1px; }
  /* a list's own view */
  .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid .card.poster { width: auto; } .grid .card.poster .img { height: 233px; }
  .titlerow { display: flex; align-items: center; gap: 12px; }
  .listcount { margin: -16px 0 24px 46px; }
  /* a phone: two cards and a part of the next */
  .phone .head { margin-bottom: 16px; }
  .phone .shelf { margin-bottom: 24px; }
  .phone .shelf .h2 { margin-bottom: 10px; }
  .phone .card.poster { width: 128px; } .phone .card.poster .img { height: 192px; }
  .phone .card .tt { font-size: 13px; }
  /* on a phone the menu button stands beside the year, so the name keeps the card's whole width (as in chapter 5) */
  .phone .card:has(> .nc-actionmenu__trigger) .tt { padding-right: 0; }
  .phone .card:has(> .nc-actionmenu__trigger) .st { padding-right: 26px; }
  .phone .card > .nc-actionmenu__trigger { right: -9px; bottom: -9px; }
  /* a phone held sideways: the heading's line, then the rows, smaller posters so a whole card shows. */
  .phone.side .pg { padding: 12px 16px; }
  .phone.side .head { margin-bottom: 12px; }
  .phone.side .shelf .h2 { margin-bottom: 10px; }
  .phone.side .cards { gap: 12px; }
  .phone.side .card.poster { width: 104px; } .phone.side .card.poster .img { height: 156px; }
  .phone.side .seeall { width: 104px; height: 156px; font-size: 13px; }
  /* a TV: the page keeps to the safe area; rows run on to the screen's edge */
  .tv .inner { width: 768px; padding-top: 8px; }
  .tv .head { margin-bottom: 16px; }
  .tv .shelf { margin-bottom: 20px; }
  .tv .shelf .h2 { margin-bottom: 10px; }
  .tv .seeall { width: 120px; height: 180px; font-size: 13px; }
  .tv .card .img.focus + .tt { color: var(--fg); }
  /* the TV's focus on a plain button: the ring and the growth (screens.css), and the focused surface */
  /* a state in the rows' place: the design system's empty state, centred */
  .state { display: flex; justify-content: center; }
</style>
</head>
