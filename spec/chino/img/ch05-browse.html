<!doctype html>
<!--
  Chapter 5, movies and shows: the figures of spec/chino/browse.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css with the design system's stylesheet, the design
  system's components are the <ds-*> tags (ds.js), the frame (top bar, tabs,
  rail) is frame.js, the icons are icons.js. Pink numbers mark the parts the
  chapter's text explains.

  The filter bar is written out as the package's FilterBar renders it, because
  ds.js's <ds-filterbar> has no narrow form and no end group: role="search"
  .nc-filterbar (+ --narrow below 640 px of its own width) > .nc-filterbar__row >
  the search, the "filters" button (narrow only), .nc-filterbar__facets (the
  facets, then the sort, chino's own control after them, and on a narrow bar
  clear all) and .nc-filterbar__end (the count; clear all on a wide bar).
  A multi select with nothing chosen is written out too: the package shows
  "any" in it, not in blue, which <ds-multiselect> can't draw.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 5 movies and shows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* artwork for the films home doesn't draw */
  .x1 { background: linear-gradient(160deg, #1f5e60 0%, #11332f 55%, #0a1a19 100%); }
  .x2 { background: linear-gradient(160deg, #557232 0%, #2e3d1a 58%, #151c0c 100%); }
  .x3 { background: linear-gradient(160deg, #723030 0%, #3e1a1a 58%, #1c0c0c 100%); }
  .x4 { background: linear-gradient(160deg, #5e3f6a 0%, #33223b 58%, #18101c 100%); }
  .x5 { background: linear-gradient(160deg, #7a4a5f 0%, #432836 58%, #1f1219 100%); }
  /* the view's heading, then the filter bar, then the grid */
  .vh { margin-bottom: 20px; }
  .nc-filterbar { margin-bottom: 24px; }
  /* the status marks: the Watchlist's bookmark top left, watched top right (chapter 6) */
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  /* a computer: seven posters a row */
  .computer .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .computer .grid .card.poster { width: auto; } .computer .grid .card.poster .img { height: 233px; }
  /* a phone: three a row */
  .phone .vh { margin-bottom: 16px; }
  .phone .nc-filterbar { margin-bottom: 16px; }
  .phone .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
  .phone .grid .card.poster { width: auto; } .phone .grid .card.poster .img { height: 152px; }
  .phone .grid .card .tt { font-size: 13px; }
  /* a card's menu: the design system's action menu, its button at the right of the card's lines, under the poster */
  .card { position: relative; }
  .card:has(> .nc-actionmenu__trigger) .tt, .card:has(> .nc-actionmenu__trigger) .st { padding-right: 36px; }
  .card > .nc-actionmenu__trigger { position: absolute; right: -4px; bottom: 1px; }
  /* on a phone the button stands beside the year, so the name keeps the card's whole width */
  .phone .grid .card:has(> .nc-actionmenu__trigger) .tt { padding-right: 0; }
  .phone .grid .card:has(> .nc-actionmenu__trigger) .st { padding-right: 26px; }
  .phone .grid .card > .nc-actionmenu__trigger { right: -9px; bottom: -9px; }
  /* a phone held sideways: the bar is wider than 640 dp, so it shows its facets; seven smaller posters a line */
  .phone.side .pg { padding: 12px 12px 12px 14px; }
  .phone.side .vh { margin-bottom: 8px; }
  .phone.side .nc-filterbar { margin-bottom: 12px; }
  .phone.side .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px 12px; }
  .phone.side .grid .card.poster .img { height: 129px; }
  /* a TV: the page keeps to the safe area; six posters a row */
  .tv .inner { width: 768px; padding-top: 8px; }     /* a focused control's ring and growth stay inside the safe area */
  .tv .vh { margin-bottom: 14px; }
  .tv .nc-filterbar { margin-bottom: 20px; }
  .tv .grid { grid-template-columns: repeat(6, 112px); gap: 18px 16px; }
  .tv .grid .card.poster { width: 112px; } .tv .grid .card.poster .img { height: 168px; }
  .tv .card .tt { font-size: 13px; }
  .tv .card .img.focus + .tt { color: var(--fg); }
  /* the TV's focus on a plain control: the ring and the growth (screens.css), and the focused surface */
  /* grey blocks in the shape of a card */
  .card .ln { height: 12px; margin-top: 10px; width: 80%; }
  .card .ln2 { height: 10px; margin-top: 6px; width: 36px; }
  /* a state in the grid's place: the design system's empty state, centred */
  .state { display: flex; justify-content: center; }
</style>
</head>
