<!doctype html>
<!--
  Chapter 5, movies and shows: the figures of spec/chino/browse.md.
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 5 movies and shows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* artwork for the films home doesn't draw */
  .x1 { background: linear-gradient(160deg, #1f5e60 0%, #11332f 55%, #0a1a19 100%); }
  .x2 { background: linear-gradient(160deg, #557232 0%, #2e3d1a 58%, #151c0c 100%); }
  .x3 { background: linear-gradient(160deg, #723030 0%, #3e1a1a 58%, #1c0c0c 100%); }
  .x4 { background: linear-gradient(160deg, #5e3f6a 0%, #33223b 58%, #18101c 100%); }
  .x5 { background: linear-gradient(160deg, #7a4a5f 0%, #432836 58%, #1f1219 100%); }
  /* the view's heading, with the sort at its end */
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  /* the filter bar: a filter is its name and a box with its value; the value is blue while it filters */
  .fbar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .facet { display: inline-flex; align-items: center; gap: 8px; }
  .facet .lb { font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); white-space: nowrap; }
  .sel { height: 48px; min-width: 128px; display: inline-flex; align-items: center; gap: 12px; padding: 0 12px 0 14px;
         border: 1px solid var(--border-control); background: var(--bg-2); color: var(--fg); font: 500 14px/1 var(--ff-mono); white-space: nowrap; }
  .sel svg.i { margin-left: auto; width: 16px; height: 16px; color: var(--cloud-blue); }
  .sel.set { color: var(--cloud-blue); }
  .b.off { color: var(--fg-dim); }                 /* clear all, with nothing to clear */
  /* the status marks: the Watchlist's bookmark top left, watched top right (chapter 6) */
  .card .mk.wl { left: 6px; right: auto; background: var(--cloud-blue); }
  .endline { margin: 24px 0 0; text-align: center; font: 400 13px/1.4 var(--ff-ui); color: var(--fg-dim); }
  /* a computer: seven posters a row */
  .computer .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .computer .grid .card.poster { width: auto; } .computer .grid .card.poster .img { height: 233px; }
  /* a phone: three a row, the filters folded under one button */
  .phone .h1 { font-size: 22px; }
  .phone .fbar { margin-bottom: 16px; }
  .phone .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
  .phone .grid .card.poster { width: auto; } .phone .grid .card.poster .img { height: 152px; }
  .phone .grid .card .tt { font-size: 13px; }
  .phone .sel { min-width: 112px; }
  .fcol { display: flex; flex-direction: column; gap: 8px; margin: -4px 0 20px; padding: 12px; border: 1px solid var(--border); background: var(--surface); }
  .fcol .facet .lb { width: 52px; }
  .fcol .facet .sel { flex: 1; }
  .fcol .b { align-self: flex-start; padding: 0 4px; }
  /* a card's menu: its button at the right of the card's lines, under the poster (chapter 6) */
  .card { position: relative; }
  .card:has(> .mn) .tt, .card:has(> .mn) .st { padding-right: 28px; }
  .card .mn { position: absolute; right: -6px; bottom: -2px; width: 30px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--fg-dim); }
  .phone .grid .card:has(> .mn) .tt { padding-right: 0; }
  .phone .grid .card .mn { height: 22px; bottom: -2px; }
  /* a phone held sideways: the bar is wide enough to show its facets in a row; seven smaller posters a line. */
  .phone.side .pg { padding: 12px 16px; }
  .phone.side .head { margin-bottom: 8px; }
  .phone.side .fbar { gap: 12px; margin-bottom: 12px; }
  .phone.side .sel { min-width: 104px; }
  .phone.side .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px 12px; }
  .phone.side .grid .card.poster .img { height: 129px; }
  .phone.side .endline { margin-top: 18px; }
  /* a TV: the page keeps to the safe area; six posters a row */
  .tv .inner { width: 768px; padding-top: 8px; }     /* a focused control's ring and growth stay inside the safe area */
  .tv .facet { gap: 14px; }
  .tv .head { margin-bottom: 12px; }
  .tv .fbar { margin-bottom: 18px; }
  .tv .sel { height: 40px; min-width: 112px; font-size: 13px; }
  .tv .sel.focus { background: var(--surface-focus); }
  .tv .grid { grid-template-columns: repeat(6, 112px); gap: 18px 16px; }
  .tv .grid .card.poster { width: 112px; } .tv .grid .card.poster .img { height: 168px; }
  .tv .card .tt { font-size: 13px; }
  .tv .card .img.focus + .tt { color: var(--fg); }
  /* grey blocks in the shape of a card */
  .card .ln { height: 12px; margin-top: 10px; width: 80%; }
  .card .ln2 { height: 10px; margin-top: 6px; width: 36px; }
</style>
</head>

        <span class="facet"><span class="lb">sort</span><span class="sel">title<i data-i="chevron-down"></i></span></span>
      </div>
      <div class="fbar">
        <span class="facet" data-co="1"><span class="lb">genre</span><span class="sel set">comedy<i data-i="chevron-down"></i></span></span>
        <span class="facet"><span class="lb">decade</span><span class="sel set">1990s<i data-i="chevron-down"></i></span></span>
        <span class="facet"><span class="lb">rating</span><span class="sel">all<i data-i="chevron-down"></i></span></span>
        <span class="b ghost" style="margin-left:auto">clear all</span>
      </div>
      <div class="empty" style="margin-top:120px">
        <i data-i="search-x" class="s48"></i>
        <h2 class="h2" data-co="2">no matches</h2>
        <p class="text">Nothing fits these filters.</p>
        <span class="b" style="margin-top:6px" data-co="3">clear filters</span>
      </div>
    </div>
  </div>
</figure>
