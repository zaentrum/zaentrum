<!doctype html>
<!--
  Chapter 3, getting started: the figures of spec/chino/start.md (the target;
  the as-deployed figure is a screenshot, sign-in-asis-web-computer.png).
  Each <figure class="shot" id="…"> becomes spec/chino/img/<id>.png:
    node scripts/render-mockups.mjs chino [id …]
  The look is screens.css, the frame (top bar, tabs, rail) is frame.js, the
  icons are icons.js. These screens come before the frame, so most leave it
  out. Pink numbers mark the parts the chapter's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chino · 3 getting started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a screen before the frame: one column in the middle */
  .onb { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 18px; padding: 170px 24px 0; }
  .onb .c { align-self: center; text-align: center; }
  .onb .h1 { text-align: center; }
  .onb .text { text-align: center; }
  .mark { display: inline-flex; align-items: center; gap: 9px; font: 600 28px/1 var(--ff-mono); color: var(--fg); }
  .mark svg { width: 20px; height: 26px; }
  .tv .onb { padding: 0; align-items: center; justify-content: center; }
  .tv .onb > * { width: 480px; }
  .tv .onb > .c { width: auto; }
  /* a field with its label and its hint or error (the design system's field) */
  .fld { display: flex; flex-direction: column; gap: 8px; }
  .fld .lbl { font: 500 13px/1.4 var(--ff-ui); color: var(--fg-2); }
  .fld .hint { font: 400 12px/1.4 var(--ff-ui); color: var(--fg-dim); }
  .fld .err { font: 400 12px/1.4 var(--ff-ui); color: var(--signal-red); display: flex; align-items: center; gap: 6px; }
  .fld .field { height: 48px; font-size: 16px; }
  .tv .fld .field { height: 40px; font-size: 15px; }
  .field.bad { border-color: var(--signal-red); box-shadow: inset 0 0 0 1px var(--signal-red); }
  .tv .field.bad.focus-row { border: 2px solid var(--signal-red); box-shadow: inset 0 0 0 3px var(--focus-ring); }
  .field.wait { color: var(--fg-muted); }
  /* the design system's loader: a square frame, three quarters lit */
  .ldr { width: 16px; height: 16px; flex: none; display: block; }
  .ldr .track { stroke: currentColor; stroke-opacity: .16; }
  .ldr .lit { stroke: currentColor; }
  .ldr.blue { color: var(--cloud-blue); }
  .b.busy { pointer-events: none; }
  /* the TV's code: a picture code and the code to type */
  .qr { background: #fff; padding: 12px; width: 172px; height: 172px; flex: none; }
  .qrsvg { display: block; width: 148px; height: 148px; }
  .codes { display: flex; gap: 6px; }
  .codes span { width: 34px; height: 46px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2);
                border: 1px solid var(--border-2); font: 700 24px/1 var(--ff-mono); color: var(--fg); }
  .codes .dash { width: 14px; background: none; border: none; color: var(--fg-dim); }
  .addr { font: 600 17px/1.2 var(--ff-mono); color: var(--cloud-blue); }
  /* who's watching: a tile per account */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 14px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile .box { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
  .tile .box.cur { box-shadow: inset 0 0 0 3px var(--cloud-blue); }
  .tile .av { width: 88px; height: 88px; font-size: 30px; line-height: 88px; }
  .tile .nm { font: 500 14px/1.3 var(--ff-ui); color: var(--fg-2); text-align: center; }
  .tile .nm.cur { color: var(--fg); }
  .tile .x { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; background: var(--bg-2); border: 1px solid var(--border-2);
             display: flex; align-items: center; justify-content: center; color: var(--fg-2); }
  .tile .plus { width: 88px; height: 88px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .tv .tiles { display: flex; gap: 28px; justify-content: center; }
  .tv .tile { width: 132px; }
  .tv .tile .box { width: 112px; height: 112px; }
  .tv .tile .av, .tv .tile .plus { width: 112px; height: 112px; font-size: 38px; line-height: 112px; }
  .tv .tile .nm { font-size: 15px; }
  .tv .tile.focus .nm { color: var(--fg); }
  .tv .tile.focus { transform: none; outline: none; }
  .tv .tile.focus .box { outline: 3px solid var(--focus-ring); outline-offset: 2px; transform: scale(1.05); }
  /* a phone held sideways: two columns side by side, the mark and the heading on the left */
  .onb2 { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; padding: 0 48px; }
  .onb2 .lft { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
  .onb2 .rgt { display: flex; flex-direction: column; gap: 18px; }
  .onb2 .h1, .onb2 .text { text-align: left; }
  .phone.side .tiles { grid-template-columns: repeat(4, 96px); justify-content: center; gap: 20px 28px; }
</style>
</head>
