<!doctype html>
<!--
  The portal's home page: the target figures of spec/portal/home.md.
  Each <figure class="shot" id="…"> becomes spec/portal/img/<id>.png:
    node scripts/render-mockups.mjs portal [id …]
  Drawn on the chino kit, linked from spec/chino/img/: screens.css with the
  design system's stylesheet, the design system's components as <ds-*> tags
  (ds.js) or as the package's own markup where ds.js has no tag (the home page
  component, nc-portal), the portal's frame from frame.js (data-frame="portal":
  the design system's top bar with zaentrum, the search, the bell and the
  avatar) and the icons from icons.js. The spaces bar is the portal's own and is
  drawn here, on the design system's tokens. Pink numbers mark the parts the
  page explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>portal · home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../chino/img/screens.css">
<script src="../../chino/img/icons.js"></script>
<style>
  /* the page under the portal's top bar: frame.js puts it in .ppage on a computer and in .scroll on a phone */
  .ppage, .phone[data-frame="portal"] > .scroll { display: flex; flex-direction: column; }
  /* a phone held sideways keeps the portal's bar on top (frame.js lays the portal's phone out upright), lower */

  /* the spaces bar, the design system's bar of spaces (planned), drawn on its tokens: across the whole width on
     the page's background, with the 1 px rule of a row of tabs along its foot. Each space a link in the monospace
     face, 13 px, lowercase, with 8 px 12 px of padding as a tab: 35 px high; the first name in line with the
     space's title and tiles; the current one brighter, with a 2 px blue line under it that lies over the rule */
  .spaces { flex: none; display: flex; height: 36px; padding: 0 12px; position: relative; z-index: 9; border-bottom: 1px solid var(--border); }
  .spaces a { display: flex; justify-content: center; text-decoration: none; }
  .spaces a > span { position: relative; display: inline-flex; align-items: center; padding: 0 12px; white-space: nowrap;
                     font: 500 13px/1 var(--ff-mono); color: var(--fg-muted); }
  .spaces a[aria-current="page"] > span { color: var(--fg); }
  .spaces .cur { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cloud-blue); }
  /* a touch screen: each space 48 px high at the least; less than 600 px wide, as a phone held upright, the spaces
     share the bar's width, each name in the middle of its share */
  .phone .spaces { height: 49px; }
  .phone:not(.side) .spaces { padding: 0; }
  .phone:not(.side) .spaces a { flex: 1 1 0; }
  .phone.side .spaces { padding: 0 4px; }

  /* a space: the design system's home page (nc-portal) with the space's name as its title and no search box of
     its own; its tiles in the design system's grid, its groups (when it has several) the design system's tile groups */
  .space { padding: 24px; }
  .phone .space { padding: 16px; }
  /* a state in the space's place: the design system's empty state, centred */
  .state { display: flex; justify-content: center; }
</style>
</head>
<body>

<!-- Figure 7 · an admin's home on a computer, apps current -->

<script src="../../chino/img/ds.js"></script>
<script src="../../chino/img/frame.js"></script>
<script>
  // after the frame: a product's mark on its tile, the chevron and the product's letter, as the portal
  // draws the products' marks (every other tile has a line icon)
  for (const t of document.querySelectorAll('.nc-tile[data-glyph]')) {
    const ic = document.createElement('span');
    ic.className = 'nc-tile__icon';
    ic.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 6 L10 12 L4.5 18" stroke="var(--cloud-blue)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><text x="12" y="16.6" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13" fill="var(--fg-2)">${t.dataset.glyph}</text></svg>`;
    t.querySelector('.nc-tile__top').prepend(ic);
  }
  // another account's initials, where the drawing isn't the admin's (frame.js draws au)
  for (const f of document.querySelectorAll('[data-avatar]')) {
    const av = f.querySelector('.tb.portal .av');
    av.textContent = f.dataset.avatar;
    av.classList.add('c2');
  }
  // words typed into the portal's search (frame.js draws its field empty)
  for (const f of document.querySelectorAll('[data-portal-query]')) {
    const field = f.querySelector('.tb.portal .search-field');
    field.classList.add('is-focused');
    field.querySelector('input').setAttribute('value', f.dataset.portalQuery);
  }
</script>
